<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#87502b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Smash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Block Smash</title>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one.woff2) format("woff2");font-display:swap}
:root{
  --ink:#1d1b2b;--text:#fff;--muted:rgba(255,255,255,.75);
  --yellow:#ffc52e;--yellow-dk:#b7800a;--red:#ff4d5e;--red-dk:#a3182a;
  --gap:5px;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font:"Lilita One","Arial Rounded MT Bold",ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,sans-serif;
}
/* ---------- Toy sets: each has its own surface, tray and rim ---------- */
body,body[data-theme="brick"]{
  --surface:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px,rgba(255,255,255,.04) 11px 12px,transparent 12px 29px),linear-gradient(180deg,#a5663a,#87502b);
  --tray:#22304f;--rim:#f2b632;--rim-dk:#a8730f;--panel:#2b3a63;--panel-dk:#18213d}
body[data-theme="gem"]{
  --surface:radial-gradient(130% 90% at 50% 20%,#55296f,#2a1240 70%);
  --tray:#170a24;--rim:#d9b04f;--rim-dk:#8a6a1c;--panel:#3d1e57;--panel-dk:#1f0e30}
body[data-theme="neon"]{
  --surface:linear-gradient(rgba(255,43,214,.09) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(0,240,255,.09) 1px,transparent 1px) 0 0/30px 30px,#0b0b18;
  --tray:#05050d;--rim:#2c2c4a;--rim-dk:#15152a;--panel:#1c1c34;--panel-dk:#07070f}
body[data-theme="pastel"]{
  --surface:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.7px) 0 0/12px 12px,#6d5986;
  --tray:#3b3150;--rim:#f6dbe8;--rim-dk:#c39fb2;--panel:#4f4268;--panel-dk:#2c2440}
body[data-theme="jelly"]{
  --surface:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 20px,transparent 20px 40px),repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 20px,transparent 20px 40px),#a3283f;
  --tray:#3a0f1c;--rim:#fff4f6;--rim-dk:#cdb3ba;--panel:#6e1a2c;--panel-dk:#3a0d17}
body[data-theme="pixel"]{
  --surface:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/8px 8px,#1d2036;
  --tray:#0e1020;--rim:#5d6080;--rim-dk:#34364e;--panel:#2a2d48;--panel-dk:#14162a}
body[data-theme="ice"]{
  --surface:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px),linear-gradient(180deg,#1f5a86,#103453);
  --tray:#0a1d31;--rim:#d8f0ff;--rim-dk:#8fb8d6;--panel:#1d4b73;--panel-dk:#0d2742}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;color:var(--text);font-family:var(--font);font-synthesis:none;letter-spacing:.01em;background:#1b1b24;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{background:var(--surface)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px)}

/* ---------- Header ---------- */
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.bestpill{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:12px;padding:6px 12px 6px 8px;
  box-shadow:0 4px 0 var(--panel-dk)}
.bestpill svg{width:20px;height:20px}
#best{font-weight:900;font-size:17px;color:var(--yellow);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.iconbtn{background:var(--panel);color:#fff;border:0;border-radius:12px;width:40px;height:38px;
  font:900 18px var(--font);display:grid;place-items:center;box-shadow:0 4px 0 var(--panel-dk)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--panel-dk)}
.scorewrap{position:relative;display:flex;justify-content:center}
#score{font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
#score.bump{animation:bump .25s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
#comboPill{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;
  padding:5px 11px;border-radius:10px;font-size:15px;font-weight:900;letter-spacing:.04em;color:#fff;
  background:var(--red);box-shadow:0 3px 0 var(--red-dk);opacity:0;transition:opacity .2s}
#comboPill.on{opacity:1}
#comboPill.pop{animation:pillpop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes pillpop{0%{transform:translateY(-50%) scale(.6)}100%{transform:translateY(-50%) scale(1)}}

/* ---------- Board: a toy-box tray with a plastic rim ---------- */
#board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:var(--gap);padding:8px;
  width:min(calc(100% - 12px),calc(100vh - 420px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(100dvh - 420px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));aspect-ratio:1;border-radius:18px;margin:6px 0 10px;background:var(--tray);
  box-shadow:0 0 0 6px var(--rim),0 10px 0 6px var(--rim-dk),0 20px 26px 6px rgba(0,0,0,.3),inset 0 6px 12px rgba(0,0,0,.5)}
.c{position:relative;border-radius:14%;background:rgba(0,0,0,.22);
  box-shadow:inset 0 3px 4px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.05)}
.c:not(.f):not(.ghost)::after{content:'';position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;
  background:rgba(255,255,255,.03);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}

/* The default set: plastic toy bricks with a stud on top */
.f,.blk,.burst{background:var(--col);border-radius:14%;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.22),inset 3px 0 0 rgba(255,255,255,.1),
             inset -3px 0 0 rgba(0,0,0,.1),0 3px 0 rgba(0,0,0,.3)}
.f::after,.blk::after,.burst::after{content:'';position:absolute;left:27%;top:23%;width:46%;height:46%;border-radius:50%;
  background:var(--col);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.3),0 4px 3px rgba(0,0,0,.2);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.18),0 2px 0 color-mix(in srgb,var(--col) 60%,#000),0 4px 3px rgba(0,0,0,.2)}
.ghost{background:var(--col);opacity:.4}
.will{filter:brightness(1.15)}
.will::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8);z-index:1}
.greyed{animation:greyout .35s ease-out forwards}
@keyframes greyout{to{filter:grayscale(1) brightness(.55)}}
.ptpop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#fff;white-space:nowrap;pointer-events:none;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:ptrise .9s ease-out forwards}
@keyframes ptrise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
#toast.tg .w{font-size:34px;color:#ff8f8f}
.target{background:rgba(255,77,94,.4);box-shadow:inset 0 0 0 3px var(--red)}
.target.f{filter:brightness(.7)}
.land{animation:land .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:translateY(-6px) scale(1.12)}100%{transform:none}}
#board.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* ---------- The other toy sets ---------- */
body[data-theme="gem"] :is(.f,.blk,.burst){border-radius:12%;
  background:conic-gradient(from 45deg,color-mix(in srgb,var(--col) 80%,#fff) 0 25%,color-mix(in srgb,var(--col) 65%,#000) 25% 50%,var(--col) 50% 75%,color-mix(in srgb,var(--col) 50%,#fff) 75% 100%);
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.25)}
body[data-theme="gem"] :is(.f,.blk,.burst)::after{left:24%;top:24%;width:52%;height:52%;border-radius:8%;
  background:linear-gradient(135deg,color-mix(in srgb,var(--col) 40%,#fff),var(--col) 60%,color-mix(in srgb,var(--col) 80%,#000));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}

body[data-theme="neon"] :is(.f,.blk,.burst){border-radius:18%;background:color-mix(in srgb,var(--col) 16%,#07071a);
  box-shadow:inset 0 0 0 2px var(--col),inset 0 0 12px color-mix(in srgb,var(--col) 60%,transparent),0 0 10px color-mix(in srgb,var(--col) 55%,transparent)}
body[data-theme="neon"] :is(.f,.blk,.burst)::after{left:26%;top:26%;width:48%;height:48%;border-radius:22%;background:none;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--col) 55%,transparent)}

body[data-theme="pastel"] :is(.f,.blk,.burst){border-radius:30%;background:var(--col);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),inset 0 3px 0 rgba(255,255,255,.5),0 3px 0 rgba(0,0,0,.25)}
body[data-theme="pastel"] :is(.f,.blk,.burst)::after{left:18%;top:16%;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:none}

body[data-theme="jelly"] :is(.f,.blk,.burst){border-radius:36%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--col) 40%,#fff) 0%,var(--col) 45%,color-mix(in srgb,var(--col) 65%,#000) 100%);
  box-shadow:inset 0 -6px 8px rgba(0,0,0,.25),inset 0 4px 6px rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.3)}
body[data-theme="jelly"] :is(.f,.blk,.burst)::after{left:20%;top:12%;width:34%;height:18%;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-20deg);box-shadow:none}

body[data-theme="pixel"] :is(.f,.blk,.burst){border-radius:0;background:var(--col);
  box-shadow:inset 3px 3px 0 color-mix(in srgb,var(--col) 50%,#fff),inset -3px -3px 0 color-mix(in srgb,var(--col) 60%,#000),0 0 0 1px rgba(0,0,0,.6)}
body[data-theme="pixel"] :is(.f,.blk,.burst)::after{left:18%;top:18%;width:18%;height:18%;border-radius:0;background:rgba(255,255,255,.85);box-shadow:none}
body[data-theme="pixel"] .c{border-radius:2px}
body[data-theme="pixel"] #board,body[data-theme="pixel"] #meter{border-radius:4px}

body[data-theme="ice"] :is(.f,.blk,.burst){border-radius:16%;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.9) 0%,color-mix(in srgb,var(--col) 70%,transparent) 45%,color-mix(in srgb,var(--col) 85%,#1a3a6a) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 -3px 6px rgba(0,30,80,.3),0 3px 0 rgba(0,0,0,.3)}
body[data-theme="ice"] :is(.f,.blk,.burst)::after{left:-10%;top:42%;width:120%;height:10%;border-radius:0;background:rgba(255,255,255,.45);transform:rotate(-45deg);box-shadow:none}

#board.restyle{animation:restyle .6s ease-out}
@keyframes restyle{0%{filter:brightness(2) saturate(0)}100%{filter:none}}

/* ---------- Clear effects: bricks pop out and tumble away ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.burst{position:absolute;animation:popout .62s cubic-bezier(.35,0,.75,1) both}
@keyframes popout{0%{transform:none}
  20%{transform:translate(calc(var(--dx) * .25),-26px) rotate(calc(var(--rot) * .2)) scale(1.1)}
  100%{transform:translate(var(--dx),150px) rotate(var(--rot)) scale(.75);opacity:0}}
.spark{position:absolute;border-radius:50%;background:var(--col);animation:spark .6s cubic-bezier(.2,.7,.4,1) both;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.flash{position:absolute;border-radius:8px;background:rgba(255,255,255,.6);animation:flash .3s ease-out both}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.ring{position:absolute;border-radius:50%;border:6px solid var(--yellow);animation:ring .5s ease-out both}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.4);opacity:0;border-width:1px}}

#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;z-index:4;
  text-align:center;opacity:0;white-space:nowrap}
#toast .w{display:block;font-size:44px;font-weight:900;letter-spacing:.02em;color:var(--tc,var(--yellow));
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#toast.t1{--tc:#7fe3ff}
#toast.t3{--tc:#ff8fb3}
#toast.t4{--tc:#c4a0ff}
#toast.t5 .w{font-size:48px}
#toast .p{display:block;font-size:26px;font-weight:900;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
#toast .c{display:inline-block;margin:4px 0 2px;padding:4px 12px;border-radius:10px;font-size:19px;font-weight:900;color:#fff;
  letter-spacing:.05em;background:var(--red);box-shadow:0 4px 0 var(--red-dk),0 0 0 3px var(--ink)}
#toast.show{animation:rise 1.1s ease-out}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#toast.t4 .w,#toast.t5 .w{animation:wobble .5s .15s}
@keyframes wobble{25%{transform:rotate(-5deg) scale(1.1)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}

/* ---------- Smash meter: ten sockets that fill with bricks ---------- */
#smashbar{width:min(calc(100% - 12px),calc(100vh - 420px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(100dvh - 420px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));display:flex;align-items:center;gap:12px}
#meter{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:5px;background:var(--tray);border-radius:12px;
  box-shadow:0 0 0 3px var(--rim),0 5px 0 3px var(--rim-dk)}
.m{position:relative;aspect-ratio:1;border-radius:14%;background:rgba(0,0,0,.25);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.m.f{background:var(--col);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.22),0 2px 0 rgba(0,0,0,.3);animation:land .25s cubic-bezier(.3,1.6,.5,1)}
#smash{border:0;border-radius:14px;padding:9px 14px 9px 10px;display:flex;align-items:center;gap:6px;
  font:900 15px var(--font);letter-spacing:.05em;color:var(--muted);background:var(--panel);box-shadow:0 5px 0 var(--panel-dk)}
#smash svg{width:20px;height:20px}
#smash.ready{color:#3a2400;background:var(--yellow);box-shadow:0 5px 0 var(--yellow-dk);animation:throb .7s infinite alternate ease-in-out}
#smash.armed{color:#fff;background:var(--red);box-shadow:0 5px 0 var(--red-dk);animation:none}
#smash:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
@keyframes throb{from{transform:scale(1)}to{transform:scale(1.07)}}
#hint{height:0;overflow:visible;position:relative;top:-4px;z-index:2;font-size:14px;color:var(--yellow);font-weight:900;text-align:center;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}

/* ---------- Tray ---------- */
#tray{width:100%;flex:0 0 auto;height:min(22vh,160px);margin-top:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:grid;justify-items:center;align-items:start;padding-top:6px;position:relative}
.piece{position:relative;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3));transition:opacity .2s,transform .2s}
.piece .blk{position:absolute}
.slot.dead .piece{opacity:.35;filter:grayscale(.85)}
.slot.lifted .piece{opacity:0}
.slot.new .piece{animation:deal .35s cubic-bezier(.3,1.5,.5,1) both}
.slot:nth-child(2).new .piece{animation-delay:.06s}
.slot:nth-child(3).new .piece{animation-delay:.12s}
@keyframes deal{0%{transform:translateY(40px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
#float{position:fixed;left:0;top:0;pointer-events:none;z-index:10;display:none;
  filter:drop-shadow(0 16px 8px rgba(0,0,0,.35))}
#float .blk{position:absolute}

/* ---------- Overlay ---------- */
#ov{position:fixed;inset:0;background:rgba(10,8,20,.6);display:none;place-items:center;z-index:20;padding:24px}
#ov.show{display:grid}
.card{background:var(--panel);border-radius:22px;padding:28px 22px 22px;max-width:360px;width:100%;text-align:center;
  box-shadow:0 8px 0 var(--panel-dk),0 22px 40px rgba(0,0,0,.4);animation:cardin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardin{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.card h2{font-size:32px;font-weight:900;margin-bottom:6px;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.card p{color:var(--muted);font-size:15px;line-height:1.45;margin:8px 0;font-weight:600;font-family:var(--body)}
.card .label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);font-weight:900}
.card .big{font-size:66px;font-weight:900;margin:2px 0;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.card ul{text-align:left;color:#fff;font-size:15px;line-height:1.5;margin:12px 0 6px 18px;font-weight:600;font-family:var(--body)}
.card li{margin:4px 0}
.btn{border:0;border-radius:16px;padding:15px 20px;font:900 18px var(--font);margin-top:16px;width:100%;
  color:#3a2400;background:var(--yellow);box-shadow:0 6px 0 var(--yellow-dk)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--yellow-dk)}
.btn.alt{color:#fff;background:var(--panel-dk);box-shadow:0 6px 0 rgba(0,0,0,.4);margin-top:14px}
.setrow{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 16px;border:0;border-radius:16px;
  background:var(--panel-dk);color:#fff;font:800 17px var(--font)}
.tog{position:relative;width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);transition:background .2s}
.tog i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .2s ease-out}
.tog.on{background:#2bb34a}
.tog.on i{transform:translateX(22px)}

/* ---------- Home ---------- */
#home{position:fixed;inset:0;z-index:15;display:none;place-items:center;overflow:hidden;background:var(--surface)}
#home.show{display:grid}
#home.leave{animation:homeout .3s ease-in forwards}
@keyframes homeout{to{opacity:0;transform:scale(1.06)}}
.hwrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 16px 96px;text-align:center}
/* The logo is built from bricks */
#logo{--px:min(calc((100vw - 76px) / 25),17px);--pad:calc(var(--px) * .9);position:relative;
  width:calc(var(--px) * 25 + var(--pad) * 2);height:calc(var(--px) * 11.3 + var(--pad) * 2);border-radius:20px;background:var(--tray);
  box-shadow:0 0 0 6px var(--rim),0 10px 0 6px var(--rim-dk),0 20px 26px 6px rgba(0,0,0,.3),inset 0 6px 12px rgba(0,0,0,.5)}
#logo .grp{position:absolute;left:var(--pad);top:var(--pad);right:var(--pad)}
#logo .grp.smash{top:calc(var(--pad) + var(--px) * 6.3);animation:smack 3.4s 2s infinite}
#logo .blk{position:absolute;width:calc(var(--px) - 1px);height:calc(var(--px) - 1px);border-radius:16%;
  animation:brickdrop .55s cubic-bezier(.3,1.35,.5,1) both}
@keyframes brickdrop{0%{transform:translateY(-70vh) rotate(var(--r));opacity:0}40%{opacity:1}100%{transform:none}}
@keyframes smack{0%,88%,100%{transform:none}90%{transform:scale(1.08) rotate(-2deg)}93%{transform:scale(.97) rotate(1.5deg)}96%{transform:scale(1.02)}}
#pile{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none}
#pile .blk{position:absolute;border-radius:14%}
.hbest{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:10px 18px 10px 14px;
  box-shadow:0 5px 0 var(--panel-dk);animation:fadeup .45s 1.3s both}
.hbest svg{width:26px;height:26px}
.hbest .lbl{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:900}
.hbest b{font-size:28px;color:var(--yellow);font-variant-numeric:tabular-nums}
.playbtn{position:relative;border:0;border-radius:22px;padding:20px 58px;margin-top:8px;display:flex;align-items:center;gap:14px;
  font:900 32px var(--font);letter-spacing:.05em;color:#3a2400;background:var(--yellow);
  box-shadow:0 9px 0 var(--yellow-dk),0 18px 24px rgba(0,0,0,.3);
  animation:fadeup .45s 1.4s both,pulse 1.4s 2s infinite ease-in-out}
/* two studs on top, like a toy brick */
.playbtn::before,.playbtn::after{content:'';position:absolute;top:-10px;width:34px;height:14px;border-radius:7px 7px 2px 2px;
  background:var(--yellow);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.12)}
.playbtn::before{left:22%}
.playbtn::after{right:22%}
.playbtn svg{width:28px;height:28px}
.playbtn:active{transform:translateY(7px) !important;box-shadow:0 2px 0 var(--yellow-dk)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fadeup{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;animation:fadeup .45s 1.5s both}
.linkbtn{border:0;background:var(--panel);color:#fff;font:800 15px var(--font);padding:11px 16px;border-radius:14px;
  box-shadow:0 5px 0 var(--panel-dk)}
.linkbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--panel-dk)}
#ver{color:var(--muted);font-weight:600;font-size:12px;font-family:var(--body)}
.modes{display:flex;gap:10px;animation:fadeup .45s 1.45s both}
.modebtn{border:0;min-width:98px;padding:10px 12px 9px;border-radius:16px;background:var(--panel);color:#fff;
  box-shadow:0 5px 0 var(--panel-dk);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font)}
.modebtn b{font-size:20px;font-weight:400}
.modebtn span{font:600 11px var(--body);color:var(--muted);white-space:nowrap}
.modebtn.done b::after{content:" \2713";color:#2bb34a}
.modebtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--panel-dk)}
#modeTag{font-size:18px;padding:6px 12px;border-radius:12px;background:var(--panel);box-shadow:0 4px 0 var(--panel-dk);
  font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
#modeTag:empty{visibility:hidden}
#modeTag.urgent{background:var(--red);box-shadow:0 4px 0 var(--red-dk);animation:throb .5s infinite alternate}
.card{max-height:calc(100dvh - 48px);overflow:auto}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 14px}
.stat{background:var(--panel-dk);border-radius:14px;padding:10px 8px}
.stat b{display:block;font-size:26px;font-weight:400;color:var(--yellow)}
.stat span{font:600 11px var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.set{padding:6px 10px;border-radius:10px;background:var(--panel-dk);font-size:14px}
.set.off{opacity:.35}
.card .sub{font:600 13px var(--body);color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bestpill">
      <svg viewBox="0 0 24 24"><path fill="#ffc83d" stroke="#a85d00" stroke-width="1.5" stroke-linejoin="round" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>
      <span id="best">0</span>
    </div>
    <div id="modeTag"></div>
    <div class="row">
      <button class="iconbtn" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3.2 2.5 11h2.7v9h5.3v-6h3v6h5.3v-9h2.7z"/></svg></button>
      <button class="iconbtn" id="restartBtn" aria-label="New game">↻</button>
    </div>
  </div>
  <div class="scorewrap"><div id="score">0</div><div id="comboPill"></div></div>

  <div id="board"><div id="fx"></div><div id="toast"></div></div>

  <div id="smashbar">
    <div id="meter"></div>
    <button id="smash"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="14" r="7" fill="currentColor"/><circle cx="8" cy="11.5" r="2" fill="rgba(255,255,255,.5)"/><path d="M15 8.5l2.5-2.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 2.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="#ff4d6d"/></svg><span id="smashLabel">SMASH</span></button>
  </div>
  <div id="hint"></div>

  <div id="tray"></div>
</div>
<div id="float"></div>
<div id="home">
  <div id="pile"></div>
  <div class="hwrap">
    <h1 id="logo" aria-label="Block Smash"></h1>
    <div class="hbest">
      <svg viewBox="0 0 24 24"><path fill="#ffc83d" stroke="#a85d00" stroke-width="1.5" stroke-linejoin="round" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>
      <span class="lbl">BEST</span><b id="homeBest">0</b>
    </div>
    <button class="playbtn" id="playBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><span id="playLabel">PLAY</span></button>
    <div class="modes">
      <button class="modebtn" id="dailyBtn"><b>Daily</b><span id="dailySub">New deal every day</span></button>
      <button class="modebtn" id="timedBtn"><b>Timed</b><span id="timedSub">2 minutes</span></button>
      <button class="modebtn" id="zenBtn"><b>Zen</b><span id="zenSub">No game over</span></button>
    </div>
    <div class="links">
      <button class="linkbtn" id="newBtn">New game</button>
      <button class="linkbtn" id="howBtn">How to play</button>
      <button class="linkbtn" id="statsBtn">Stats</button>
      <button class="linkbtn" id="setBtn">Settings</button>
    </div>
    <button class="linkbtn" id="updBtn" style="display:none">Update available — tap to update</button>
    <p id="ver"></p>
  </div>
</div>
<div id="ov"><div class="card" id="card"></div></div>

<script>
'use strict';
const N = 8, SMASH_MAX = 10;
const THEMES = {
  brick:  { name:'Bricks', colors:['#e3262f','#ffcd03','#2bb34a','#1e6fd9','#ff7a1a','#9b5de5','#00b2c8','#f45ba1'] },
  gem:    { name:'Gems',   colors:['#e0115f','#0f52ba','#10a35a','#9b30ff','#ffb300','#19c3c3','#ff4fa3','#d4c20a'] },
  neon:   { name:'Neon',   colors:['#ff2bd6','#00f0ff','#39ff14','#ffe600','#ff6b00','#8a5cff','#ff3860','#00ff9c'] },
  pastel: { name:'Clay',   colors:['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff'] },
  jelly:  { name:'Sweets', colors:['#ff3b6b','#ffb627','#3ddc84','#2ec4ff','#a66bff','#ff7bd5','#ff8c42','#4ee6d0'] },
  pixel:  { name:'Pixel',  colors:['#e43b44','#f77622','#feae34','#63c74d','#0099db','#2ce8f5','#b55088','#8b9bb4'] },
  ice:    { name:'Ice',    colors:['#bfe9ff','#8fd3ff','#5fb8ff','#a7f3f0','#d6c8ff','#7ee0ff','#cfe8ff','#9ad7e6'] },
};
const themeKey = () => (typeof S !== 'undefined' && S && THEMES[S.theme]) ? S.theme : 'brick';
const themeColors = () => THEMES[themeKey()].colors;
// A different style from the one you just had
function nextTheme(cur){ const keys = Object.keys(THEMES).filter(k => k !== cur); return keys[Math.floor(rand()*keys.length)]; }

// ---------- Pieces ----------
// Base shapes ('#' = block, '|' = new row) with a weight. All rotations are generated.
const BASE = [
  ['#',1], ['##',2], ['###',2], ['####',2], ['#####',2],
  ['##|##',3], ['###|###',3], ['###|###|###',3],
  ['#.|##',2], ['#.|#.|##',2], ['.#|.#|##',2],
  ['###|.#.',2], ['##.|.##',1], ['.##|##.',1], ['#..|#..|###',3],
];
const parse = s => { const out=[]; s.split('|').forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==='#') out.push([r,c]); })); return out; };
const norm = cells => {
  const mr=Math.min(...cells.map(p=>p[0])), mc=Math.min(...cells.map(p=>p[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot = cells => norm(cells.map(([r,c])=>[c,-r]));
const SHAPES = BASE.map(([s,w]) => {
  const seen=new Set(), orients=[]; let cur=norm(parse(s));
  for (let i=0;i<4;i++){ const k=JSON.stringify(cur); if(!seen.has(k)){seen.add(k);orients.push(cur);} cur=rot(cur); }
  return {orients, w};
});
const TOTAL_W = SHAPES.reduce((a,s)=>a+s.w,0);

// ---------- The honest dealer ----------
// Uniform randomness from the OS. It never looks at your score, your history, or anything else.
const rand = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
const pick = arr => arr[Math.floor(rand()*arr.length)];
// The daily uses a seeded generator (state saved in S.seed) so everyone gets the same deal that day.
// Every other mode uses the OS randomness above.
function drand(){
  if (typeof S === 'undefined' || !S || S.seed == null) return rand();
  let t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const dpick = arr => arr[Math.floor(drand()*arr.length)];
function randomPiece(){
  let x = drand()*TOTAL_W, shape = SHAPES[0];
  for (const s of SHAPES){ if ((x -= s.w) < 0){ shape = s; break; } }
  const cells = dpick(shape.orients);
  return { cells, h: Math.max(...cells.map(p=>p[0]))+1, w: Math.max(...cells.map(p=>p[1]))+1, color: dpick(themeColors()) };
}
// Fair-hand rule: re-deal (randomly) until every piece fits somewhere on the board.
// It never chooses pieces to help or hurt you. If no fair hand turns up, you get a random one.
function dealHand(){
  let hand;
  for (let i=0;i<60;i++){
    hand = [randomPiece(), randomPiece(), randomPiece()];
    if (hand.every(fitsAnywhere)) return hand;
  }
  return hand;
}

// ---------- State ----------
let S;
const MODES = { classic:{ name:'Classic' }, daily:{ name:'Daily' }, timed:{ name:'Timed' }, zen:{ name:'Zen' } };
const TIMED_MS = 120000;
const saveKey = m => m === 'classic' ? 'bs-state' : 'bs-state-' + m;
const bestKey = m => m === 'classic' ? 'bs-best' : 'bs-best-' + m;
const modeOf = () => (S && S.mode) || 'classic';
const pad2 = n => String(n).padStart(2, '0');
const dayStr = (offset = 0) => { const d = new Date(); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const today = () => dayStr(0);
function hashStr(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h | 0; }
function fresh(mode = 'classic'){
  const st = { mode, grid: Array(N*N).fill(null), hand: null, score: 0, meter: 0, combo: 0, since: 0, over: false,
    startBest: +store.get(bestKey(mode)) || 0, nb: false, theme: nextTheme(store.get('bs-theme')) };
  if (mode === 'daily'){
    st.day = today(); st.seed = hashStr('blocksmash/' + st.day);
    const keys = Object.keys(THEMES); st.theme = keys[(st.seed >>> 0) % keys.length];
  }
  if (mode === 'timed') st.timeLeft = TIMED_MS;
  return st;
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let best = +store.get('bs-best') || 0;
function loadBest(){ best = +store.get(bestKey(modeOf())) || 0; }
function save(){
  store.set(saveKey(modeOf()), JSON.stringify(S));
  if (S.score > best){ best = S.score; store.set(bestKey(modeOf()), best); }
}

// ---------- Stats ----------
function stats(){
  let st = {}; try { st = JSON.parse(store.get('bs-stats')) || {}; } catch {}
  return Object.assign({ started:0, finished:0, total:0, lines:0, allClears:0, bestCombo:0, smashes:0, sets:{}, modes:{} }, st);
}
function bump(fn){ const st = stats(); fn(st); store.set('bs-stats', JSON.stringify(st)); }

// ---------- Daily ----------
function dailyInfo(){ try { return JSON.parse(store.get('bs-daily')) || {}; } catch { return {}; } }
const dailyDone = () => { const d = dailyInfo(); return d.day === today() && d.done; };
const streakNow = () => { const d = dailyInfo(); return (d.lastDay === today() || d.lastDay === dayStr(-1)) ? (d.streak || 0) : 0; };

const at = (r,c) => S.grid[r*N+c];
function canPlace(p, r, c){
  for (const [dr,dc] of p.cells){
    const rr=r+dr, cc=c+dc;
    if (rr<0||cc<0||rr>=N||cc>=N||at(rr,cc)) return false;
  }
  return true;
}
function fitsAnywhere(p){
  for (let r=0;r<=N-p.h;r++) for (let c=0;c<=N-p.w;c++) if (canPlace(p,r,c)) return true;
  return false;
}
// Which rows/cols would clear if p were placed at r,c
function linesAfter(p, r, c){
  const g = S.grid.slice();
  for (const [dr,dc] of p.cells) g[(r+dr)*N + c+dc] = 1;
  const out = new Set(), rows = [], cols = [];
  for (let i=0;i<N;i++){
    let row=true, col=true;
    for (let j=0;j<N;j++){ if(!g[i*N+j]) row=false; if(!g[j*N+i]) col=false; }
    if (row){ rows.push(i); for(let j=0;j<N;j++) out.add(i*N+j); }
    if (col){ cols.push(i); for(let j=0;j<N;j++) out.add(j*N+i); }
  }
  return {cells: out, lines: rows.length + cols.length, rows, cols};
}

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const boardEl=$('board'), trayEl=$('tray'), floatEl=$('float'), toastEl=$('toast'), fxEl=$('fx');
const cellEls = [];
for (let i=0;i<N*N;i++){ const d=document.createElement('div'); d.className='c'; boardEl.appendChild(d); cellEls.push(d); }
for (let i=0;i<SMASH_MAX;i++){ const d=document.createElement('div'); d.className='m'; d.style.setProperty('--col','#ffc52e'); $('meter').appendChild(d); }
const slots = [0,1,2].map(i => { const d=document.createElement('div'); d.className='slot'; d.dataset.i=i; trayEl.appendChild(d); return d; });

function boardGeom(){
  const a=cellEls[0].getBoundingClientRect(), b=cellEls[1].getBoundingClientRect();
  return { x:a.left, y:a.top, size:a.width, pitch:b.left-a.left };
}

// Score counts up rather than jumping
let shownScore = 0, scoreRaf = 0;
function animateScore(){
  cancelAnimationFrame(scoreRaf);
  const from = shownScore, to = S.score, t0 = performance.now(), dur = Math.min(600, 150 + (to-from)*4);
  if (to > from + 5){ const el=$('score'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const step = t => {
    const k = Math.min(1, (t - t0) / dur);
    shownScore = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('score').textContent = shownScore;
    if (k < 1) scoreRaf = requestAnimationFrame(step);
  };
  if (to <= from){ shownScore = to; $('score').textContent = to; } else scoreRaf = requestAnimationFrame(step);
}

let lastHandKey = '';
let appliedTheme = null;
function applyTheme(){
  const t = themeKey();
  if (t === appliedTheme) return;
  const first = appliedTheme === null; appliedTheme = t;
  document.body.dataset.theme = t;
  store.set('bs-theme', t);
  paintHome();
  if (!first){ boardEl.classList.remove('restyle'); void boardEl.offsetWidth; boardEl.classList.add('restyle'); }
}
function render(){
  applyTheme();
  S.grid.forEach((col,i)=>{
    const el=cellEls[i];
    el.className = col ? 'c f' : 'c';
    if (col) el.style.setProperty('--col', col); else el.style.removeProperty('--col');
    el.style.animationDelay = '';
  });
  animateScore();
  renderCombo();
  renderModeTag();
  $('restartBtn').style.display = modeOf() === 'daily' ? 'none' : '';
  $('best').textContent = Math.max(best, S.score);
  [...$('meter').children].forEach((m, i) => { const on = i < S.meter; if (on !== m.classList.contains('f')) m.className = on ? 'm f' : 'm'; });
  const sb=$('smash');
  sb.className = smashArmed ? 'armed' : (S.meter>=SMASH_MAX ? 'ready' : '');
  $('smashLabel').textContent = smashArmed ? 'CANCEL' : (S.meter>=SMASH_MAX ? 'SMASH' : `${S.meter}/${SMASH_MAX}`);
  renderTray();
}
function renderTray(){
  const g = boardGeom();
  const key = JSON.stringify(S.hand.map(p => p && p.cells.length));
  const fresh = S.hand.every(Boolean) && key !== lastHandKey;
  lastHandKey = key;
  slots.forEach((slot,i)=>{
    slot.innerHTML=''; slot.classList.remove('dead','lifted','new');
    const p = S.hand[i]; if (!p) return;
    const sw = slot.clientWidth, sh = slot.clientHeight;
    const size = Math.min(g.size*0.62, (sw-8)/5, (sh-8)/5);
    const gap = Math.max(2, size*0.1);
    const piece = document.createElement('div'); piece.className='piece';
    piece.style.width = (p.w*size + (p.w-1)*gap) + 'px';
    piece.style.height = (p.h*size + (p.h-1)*gap) + 'px';
    for (const [r,c] of p.cells){
      const b=document.createElement('div'); b.className='blk';
      b.style.cssText = `--col:${p.color};width:${size}px;height:${size}px;left:${c*(size+gap)}px;top:${r*(size+gap)}px`;
      piece.appendChild(b);
    }
    slot.appendChild(piece);
    if (fresh) slot.classList.add('new');
    if (!fitsAnywhere(p)) slot.classList.add('dead');
  });
}

let toastTimers = [];
function toast(word, pts, combo, tier){
  const multi = w => [...w].map((ch, i) => ch === ' ' ? ' ' : `<span style="color:${themeColors()[i % 8]}">${ch}</span>`).join('');
  toastEl.innerHTML = (word ? `<span class="w">${tier === 5 ? multi(word) : word}</span>` : '') +
    (combo ? `<span class="c">${combo}</span>` : '') + (pts ? `<span class="p">${pts}</span>` : '');
  toastEl.className = tier ? 't' + tier : '';
  void toastEl.offsetWidth; toastEl.classList.add('show');
}
// Follow-up callouts (SMASH READY, NEW BEST) wait their turn after the main one
function laterToast(delay, ...args){ toastTimers.push(setTimeout(() => toast(...args), delay)); }
function clearToasts(){ toastTimers.forEach(clearTimeout); toastTimers = []; }
let lastCombo = 0;
function renderModeTag(){
  const el = $('modeTag'), m = modeOf();
  if (m === 'timed'){
    const secs = Math.ceil((S.timeLeft ?? TIMED_MS) / 1000);
    el.textContent = `${Math.floor(secs/60)}:${pad2(secs % 60)}`;
    el.classList.toggle('urgent', secs <= 10 && !S.over);
  } else { el.textContent = m === 'classic' ? '' : MODES[m].name.toUpperCase(); el.classList.remove('urgent'); }
}
function renderCombo(){
  const el = $('comboPill');
  if (S.combo >= 2){
    el.textContent = `COMBO x${S.combo}`;
    el.classList.add('on');
    if (S.combo !== lastCombo){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  } else el.classList.remove('on');
  lastCombo = S.combo;
}
// ---------- Sound ----------
// All sounds are generated in code (Web Audio), so nothing to download and it works offline.
const soundOn = () => store.get('bs-sound') !== 'off';
const musicOn = () => store.get('bs-music') === 'on';   // music starts off
const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function init(){
    if (!soundOn() && !musicOn()) return;
    if (ctx){ if (ctx.state === 'suspended') ctx.resume(); musicSync(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .6, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    musicSync();
  }
  function tone(freq, t0, dur, o = {}){
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(o.vol || .3, t0 + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + .02);
  }
  function noise(t0, dur, o = {}){
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = o.type || 'bandpass'; f.frequency.value = o.freq || 1500; f.Q.value = o.q || 1;
    g.gain.setValueAtTime(o.vol || .3, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur);
  }
  const semi = (f, n) => f * Math.pow(2, n/12);
  // ---------- Music: a little looping tune, generated as it plays ----------
  let mGain = null, mTimer = null, mNext = 0, mStep = 0;
  const STEP = 60 / 112 / 2;                               // eighth notes at 112 bpm
  const PROG = [[0,4,7], [-3,0,4], [-7,-3,0], [-5,-1,2]];   // C  Am  F  G
  const ARP  = [0,1,2,1, 0,2,1,2];
  const MEL  = [[12,null,7,null,9,null,7,4], [5,null,4,null,2,null,4,null], [0,null,2,4,5,null,4,2], [2,null,null,4,7,null,null,null]];
  function mNote(freq, t0, dur, type, vol){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(mGain); o.start(t0); o.stop(t0 + dur + .02);
  }
  function schedule(){
    while (mNext < ctx.currentTime + .3){
      const bar = Math.floor(mStep / 8) % 4, i = mStep % 8, chord = PROG[bar];
      if (i % 4 === 0) mNote(semi(130.81, chord[0]), mNext, STEP*3.6, 'triangle', .13);
      mNote(semi(523.25, chord[ARP[i]] + (i >= 4 ? 12 : 0)), mNext, STEP*.8, 'square', .018);
      const m = MEL[(Math.floor(mStep / 32) % 2) ? (bar + 2) % 4 : bar][i];
      if (m != null) mNote(semi(523.25, m), mNext, STEP*1.8, 'triangle', .05);
      mNext += STEP; mStep++;
    }
  }
  function musicSync(){
    const want = musicOn() && ctx && !document.hidden;
    if (want && !mTimer){
      if (!mGain){ mGain = ctx.createGain(); mGain.gain.value = .6; mGain.connect(master); }
      mNext = ctx.currentTime + .1; mTimer = setInterval(schedule, 100); schedule();
    } else if (!want && mTimer){ clearInterval(mTimer); mTimer = null; }
  }
  const play = fn => { if (!soundOn()) return; init(); if (!ctx) return; try { fn(ctx.currentTime); } catch {} };
  return {
    init,
    pick:  () => play(t => tone(620, t, .05, {type:'triangle', vol:.12, to:820})),
    // plastic clack: a short knock plus a click
    place: () => play(t => { tone(210, t, .08, {type:'triangle', vol:.35, to:110}); noise(t, .04, {vol:.22, freq:3200, q:.9}); }),
    deny:  () => play(t => tone(170, t, .12, {vol:.18, to:120})),
    // the chime climbs a step with every combo
    clear: (lines, combo) => play(t => {
      const base = semi(523.25, Math.min(combo - 1, 10) * 2);
      [0, 4, 7, 12, 16].slice(0, 2 + Math.min(lines, 3)).forEach((n, i) => tone(semi(base, n), t + i*.055, .28, {type:'square', vol:.065}));
      noise(t, .2, {vol:.32, freq:900, q:.6});
      tone(95, t, .16, {vol:.45, to:50});
    }),
    allclear: () => play(t => [0,4,7,12,16,19,24].forEach((n, i) => tone(semi(523.25, n), t + i*.07, .32, {type:'triangle', vol:.16}))),
    ready: () => play(t => [0,7,12].forEach((n, i) => tone(semi(880, n), t + i*.05, .16, {type:'square', vol:.055}))),
    best:  () => play(t => [0,4,7,12].forEach((n, i) => tone(semi(659.25, n), t + i*.1, .36, {type:'square', vol:.06}))),
    smash: () => play(t => { noise(t, .55, {vol:.7, freq:380, q:.4, type:'lowpass'}); tone(130, t, .5, {vol:.6, to:32}); }),
    over:  () => play(t => [0,-3,-7,-12].forEach((n, i) => tone(semi(392, n), t + i*.17, .42, {type:'triangle', vol:.16}))),
    tap:   () => play(t => tone(760, t, .035, {type:'triangle', vol:.1})),
    count: () => play(t => tone(1200, t, .03, {type:'square', vol:.03})),
    tick:  () => play(t => tone(1000, t, .05, {type:'square', vol:.05})),
    shuffle: () => play(t => [0,5,10].forEach((n, i) => tone(semi(440, n), t + i*.04, .12, {type:'triangle', vol:.1}))),
    musicSync,
  };

})();
document.addEventListener('visibilitychange', () => { SFX.musicSync(); if (document.hidden && typeof S !== 'undefined' && S) save(); });
// Browsers only allow sound after a tap, so wake the audio on every touch
document.addEventListener('pointerdown', () => SFX.init(), true);
document.addEventListener('click', e => { if (e.target.closest('button')) SFX.tap(); }, true);

function hint(text){ $('hint').textContent = text || ''; }
function shake(){ boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); }
// Vibration can be switched off in Settings
const vibeOn = () => store.get('bs-vibe') !== 'off';
function buzz(p){ if (!vibeOn()) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch {} }

// ---------- Game flow ----------
function place(i, r, c){
  if (S.over) return;
  const p = S.hand[i], before = S.score;
  for (const [dr,dc] of p.cells) S.grid[(r+dr)*N + c+dc] = p.color;
  S.score += p.cells.length;
  SFX.place();
  S.hand[i] = null;

  const {cells, lines, rows, cols} = linesAfter({cells:[], h:0, w:0}, 0, 0);
  const cleared = [];
  if (lines){
    clearToasts();
    S.combo++; S.since = 0;
    bump(st => { st.lines += lines; st.bestCombo = Math.max(st.bestCombo, S.combo); });
    let pts = Math.round(10 * lines*(lines+1)/2 * (1 + (S.combo-1)*0.5));
    const wasReady = S.meter >= SMASH_MAX;
    S.meter = Math.min(SMASH_MAX, S.meter + lines);
    cells.forEach(idx => { cleared.push([idx, S.grid[idx]]); S.grid[idx] = null; });
    const allClear = S.grid.every(x => !x);
    if (allClear){
      pts += 300;
      // Clearing the board earns a new block style; pieces still in hand switch over too
      S.theme = nextTheme(S.theme);
      bump(st => { st.allClears++; st.sets[S.theme] = (st.sets[S.theme] || 0) + 1; });
      S.hand.forEach(h => { if (h) h.color = pick(themeColors()); });
    }
    S.score += pts;

    const WORDS = [[], ['GOOD!','NICE!','SWEET!'], ['GREAT!','DOUBLE!'], ['AMAZING!','TRIPLE!'], ['INCREDIBLE!','UNREAL!','QUAD!']];
    const tier = allClear ? 5 : Math.min(4, lines + (S.combo >= 4 ? 1 : 0));
    const word = allClear ? 'ALL CLEAR!' : pick(WORDS[Math.min(4, lines)]);
    toast(word, `+${pts}`, S.combo >= 2 ? `COMBO x${S.combo}` : '', tier);
    if (allClear) SFX.allclear(); else SFX.clear(lines, S.combo);

    let wait = 1100;
    if (!wasReady && S.meter >= SMASH_MAX){ laterToast(wait, 'SMASH READY!', '', '', 2); setTimeout(SFX.ready, wait); wait += 1100; }
    if (!S.nb && S.startBest > 0 && S.score > S.startBest){ S.nb = true; laterToast(wait, 'NEW BEST!', '', '', 5); setTimeout(SFX.best, wait); wait += 1100; }
    if (allClear) laterToast(wait, THEMES[S.theme].name.toUpperCase(), 'new set', '', 4);
    if (lines >= 2 || S.combo >= 3 || allClear) shake();
    buzz(lines >= 2 ? [30,40,30] : 25);
  } else if (++S.since >= 3){ S.combo = 0; }

  if (S.hand.every(x=>!x)) S.hand = dealHand();
  const landed = p.cells.map(([dr,dc]) => (r+dr)*N + c+dc).filter(idx => S.grid[idx]);
  afterMove(cleared, { origin: [r + (p.h-1)/2, c + (p.w-1)/2], rows, cols, landed, gained: S.score - before });
}

function pointsPop([r, c], n){
  const a = cellEls[Math.floor(r)*N + Math.floor(c)], d = document.createElement('div');
  d.className = 'ptpop'; d.textContent = '+' + n;
  d.style.left = (a.offsetLeft + a.offsetWidth * (1 + (c - Math.floor(c))*2) / 2) + 'px';
  d.style.top  = (a.offsetTop + a.offsetHeight * (1 + (r - Math.floor(r))*2) / 2) + 'px';
  fxEl.appendChild(d); setTimeout(() => d.remove(), 950);
}

// Clear effects live on their own layer over the board, so the board itself is always up to date.
function effects(cleared, info){
  if (!cleared || !cleared.length) return;
  const nodes = [];
  const add = (cls, css) => { const d=document.createElement('div'); d.className=cls; d.style.cssText=css; fxEl.appendChild(d); nodes.push(d); };
  const box = el => ({ l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });
  for (const i of info.rows || []){
    const a = box(cellEls[i*N]), b = box(cellEls[i*N+N-1]);
    add('flash', `left:${a.l}px;top:${a.t}px;width:${b.l+b.w-a.l}px;height:${a.h}px`);
  }
  for (const i of info.cols || []){
    const a = box(cellEls[i]), b = box(cellEls[(N-1)*N+i]);
    add('flash v', `left:${a.l}px;top:${a.t}px;width:${a.w}px;height:${b.t+b.h-a.t}px`);
  }
  const [or, oc] = info.origin || [3.5, 3.5];
  if (info.ring){
    const a = box(cellEls[Math.floor(or)*N + Math.floor(oc)]), s = a.w*2;
    add('ring', `left:${a.l + a.w*(oc-Math.floor(oc)) + a.w/2 - s/2}px;top:${a.t + a.h*(or-Math.floor(or)) + a.h/2 - s/2}px;width:${s}px;height:${s}px`);
  }
  let maxDelay = 0;
  for (const [idx, col] of cleared){
    const r = Math.floor(idx/N), c = idx%N, b = box(cellEls[idx]);
    const delay = Math.round((Math.abs(r-or) + Math.abs(c-oc)) * 30);
    maxDelay = Math.max(maxDelay, delay);
    add('burst', `--col:${col};left:${b.l}px;top:${b.t}px;width:${b.w}px;height:${b.h}px;animation-delay:${delay}ms;` +
      `--dx:${Math.round((rand()-.5)*110)}px;--rot:${Math.round((rand()-.5)*240)}deg`);
    for (let k=0;k<2;k++){
      const ang = rand()*Math.PI*2, dist = 35 + rand()*80, s = 5 + rand()*7;
      add('spark', `--col:${col};left:${b.l+b.w/2-s/2}px;top:${b.t+b.h/2-s/2}px;width:${s}px;height:${s}px;` +
        `--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;--rot:${Math.round(rand()*360)}deg;animation-delay:${delay}ms`);
    }
  }
  setTimeout(() => nodes.forEach(n => n.remove()), 850 + maxDelay);
}

function afterMove(cleared, info){
  info = info || {};
  hint('');
  const anyFit = S.hand.some(p => p && fitsAnywhere(p));
  if (!anyFit){
    if (S.meter >= SMASH_MAX) hint('Out of moves — use your SMASH!');
    else if (modeOf() === 'zen') cleared = (cleared || []).concat(zenShuffle());
    else { S.over = true; recordEnd(); }
  }
  save(); render();
  for (const idx of info.landed || []) cellEls[idx].classList.add('land');
  effects(cleared, info);
  if (info.gained) pointsPop(info.origin, info.gained);
  if (S.over) setTimeout(gameOverSequence, cleared && cleared.length ? 900 : 300);
}

// Zen: deal a fresh hand, and knock random bricks loose until something fits
function zenShuffle(){
  const removed = [];
  S.hand = dealHand();
  while (!S.hand.some(p => p && fitsAnywhere(p))){
    const filled = []; S.grid.forEach((v, i) => { if (v) filled.push(i); });
    if (!filled.length) break;
    const i = filled[Math.floor(rand()*filled.length)];
    removed.push([i, S.grid[i]]); S.grid[i] = null;
  }
  toast('SHUFFLE!', '', '', 1); SFX.shuffle();
  return removed;
}

// Smash clears a 2x2 area; r0,c0 is its top-left cell.
function smashAt(r0, c0){
  const cleared = [];
  for (let r=r0;r<=r0+1;r++) for (let c=c0;c<=c0+1;c++){
    if (r<0||c<0||r>=N||c>=N) continue;
    const idx=r*N+c; if (S.grid[idx]){ cleared.push([idx,S.grid[idx]]); S.grid[idx]=null; }
  }
  S.score += cleared.length * 5;
  S.meter = 0; smashArmed = false;
  bump(st => st.smashes++);
  shake(); buzz(70); SFX.smash();
  toast('SMASH!', cleared.length ? `+${cleared.length*5}` : '');
  afterMove(cleared.length ? cleared : [[r0*N+c0, '#ffc83d']], { origin: [r0+0.5, c0+0.5], ring: true });
}

function newGame(mode = modeOf()){
  clearToasts();
  S = fresh(mode); loadBest(); S.hand = dealHand(); smashArmed=false; shownScore = 0;
  laterToast(450, mode === 'classic' ? THEMES[S.theme].name.toUpperCase() : MODES[mode].name.toUpperCase(),
             mode === 'classic' ? 'new set' : THEMES[S.theme].name + ' set', '', 1);
  bump(st => { st.started++; st.modes[mode] = (st.modes[mode] || 0) + 1; st.sets[S.theme] = (st.sets[S.theme] || 0) + 1; });
  save(); hint(''); render(); hideOv();
}
// A saved, unfinished game for this mode (today's only, for the daily)
function loadSaved(mode){
  try {
    const st = JSON.parse(store.get(saveKey(mode)));
    if (st && st.grid && st.grid.length === N*N && st.hand && !st.over && (mode !== 'daily' || st.day === today())){
      st.mode = mode; return st;
    }
  } catch {}
  return null;
}
// Picks up where you left off in that mode, or starts a new game. Returns false if there's nothing to play.
function switchTo(mode){
  if (S && modeOf() === mode && !S.over && (mode !== 'daily' || S.day === today())){ render(); return true; }
  if (S) save();
  const saved = loadSaved(mode);
  if (saved){ clearToasts(); S = saved; loadBest(); smashArmed = false; shownScore = S.score; hint(''); render(); return true; }
  if (mode === 'daily' && dailyDone()){ showDailyCard(); return false; }
  newGame(mode); return true;
}

// ---------- Overlay ----------
function showOv(html){ $('card').innerHTML = html; $('ov').classList.add('show'); }
function hideOv(){ $('ov').classList.remove('show'); }
function recordEnd(){
  if (S.recorded) return;
  S.recorded = true;
  bump(st => { st.finished++; st.total += S.score; });
  if (modeOf() === 'daily'){
    const d = dailyInfo(), t = today();
    d.streak = d.lastDay === t ? (d.streak || 1) : (d.lastDay === dayStr(-1) ? (d.streak || 0) + 1 : 1);
    d.bestStreak = Math.max(d.bestStreak || 0, d.streak);
    d.lastDay = t; d.day = t; d.score = S.score; d.done = true; d.best = Math.max(d.best || 0, S.score);
    store.set('bs-daily', JSON.stringify(d));
  }
  save();
}
function gameOverSequence(msg = 'OUT OF MOVES'){
  if (!S.over) return;
  recordEnd();
  if (homeEl.classList.contains('show')) return;
  SFX.over(); buzz([40, 60, 40]);
  // the board greys out from the bottom row up
  cellEls.forEach((el, i) => { el.style.animationDelay = ((N - 1 - Math.floor(i/N)) * 70) + 'ms'; el.classList.add('greyed'); });
  toast(msg, '', '', 'g');
  setTimeout(showGameOver, 1500);
}
function showGameOver(){
  if (!S.over || homeEl.classList.contains('show')) return;
  const isBest = S.score >= best && S.score > 0, mode = modeOf();
  if (mode === 'daily'){
    const d = dailyInfo();
    showOv(`<div class="label">${isBest ? '★ Best daily yet ★' : 'Daily complete'}</div>
      <div class="big" id="goScore">0</div>
      <p>${streakNow()}-day streak · best daily ${d.best || 0}</p>
      <p class="sub">New deal in ${untilMidnight()}</p>
      <button class="btn" id="shareBtn">Share</button>
      <button class="btn alt" id="goHome">Home</button>`);
    $('shareBtn').onclick = shareDaily;
  } else {
    const head = mode === 'timed' ? "Time's up" : 'Out of moves';
    showOv(`<div class="label">${isBest ? '★ New best ★' : head}</div>
      <div class="big" id="goScore">0</div>
      <p>${MODES[mode].name} best: ${best}</p>
      <button class="btn" id="again">Play again</button>
      <button class="btn alt" id="goHome">Home</button>`);
    $('again').onclick = () => newGame(mode);
  }
  $('goHome').onclick = () => { hideOv(); showHome(); };
  // count the score up
  const end = S.score, t0 = performance.now(), dur = Math.min(1200, 300 + end * 2);
  let lastTick = 0;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), v = Math.round(end * (1 - Math.pow(1 - k, 3)));
    const el = $('goScore'); if (!el) return;
    el.textContent = v;
    if (t - lastTick > 60 && k < 1){ SFX.count(); lastTick = t; }
    if (k < 1) requestAnimationFrame(step); else if (isBest) SFX.best();
  };
  requestAnimationFrame(step);
}

function untilMidnight(){
  const now = new Date(), next = new Date(now); next.setHours(24, 0, 0, 0);
  const mins = Math.ceil((next - now) / 60000);
  return mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}m` : `${mins}m`;
}
async function shareDaily(){
  const d = dailyInfo();
  const text = `Block Smash daily ${d.day}: ${d.score} points (${streakNow()}-day streak)`;
  try {
    if (navigator.share){ await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    $('shareBtn').textContent = 'Copied!';
  } catch {}
}
function showDailyCard(){
  const d = dailyInfo();
  showOv(`<div class="label">Today's daily</div>
    <div class="big">${d.score || 0}</div>
    <p>${streakNow()}-day streak · best daily ${d.best || 0}</p>
    <p class="sub">You've played today. New deal in ${untilMidnight()}.</p>
    <button class="btn" id="shareBtn">Share</button>
    <button class="btn alt" id="dcDone">Close</button>`);
  $('shareBtn').onclick = shareDaily; $('dcDone').onclick = hideOv;
}
function showStats(){

  const tile = (v, label) => `<div class="stat"><b>${v}</b><span>${label}</span></div>`;
  const bests = ['classic','timed','daily','zen'].map(m => tile(+store.get(bestKey(m)) || 0, `Best ${MODES[m].name}`)).join('');
  showOv(`<h2>Stats</h2>
    <div class="statgrid">
      ${tile(st.started, 'Games played')}${tile(st.finished ? Math.round(st.total / st.finished) : 0, 'Average score')}
      ${bests}
      ${tile(st.lines, 'Lines cleared')}${tile(st.bestCombo ? 'x' + st.bestCombo : '–', 'Best combo')}
      ${tile(st.allClears, 'All clears')}${tile(st.smashes, 'Smashes')}

    </div>
    <div class="label">Toy sets</div>
    <div class="sets">${Object.keys(THEMES).map(k => `<span class="set ${st.sets[k] ? '' : 'off'}">${THEMES[k].name}${st.sets[k] ? ' · ' + st.sets[k] : ''}</span>`).join('')}</div>
    <button class="btn" id="stDone">Done</button>`);
  $('stDone').onclick = hideOv;
}

// ---------- Home ----------
const homeEl = $('home');
// The logo is built from bricks: a 5-row block font
const FONT = {
  B:['###.','#..#','###.','#..#','###.'], L:['#...','#...','#...','#...','####'], O:['.##.','#..#','#..#','#..#','.##.'],
  C:['.###','#...','#...','#...','.###'], K:['#..#','#.#.','##..','#.#.','#..#'], S:['.###','#...','.##.','...#','###.'],
  M:['#...#','##.##','#.#.#','#...#','#...#'], A:['.##.','#..#','####','#..#','#..#'], H:['#..#','#..#','####','#..#','#..#'],
};
function buildLogo(){
  const logo = $('logo'); logo.innerHTML = '';
  ['BLOCK','SMASH'].forEach((word, wi) => {
    const grp = document.createElement('div'); grp.className = 'grp' + (wi ? ' smash' : '');
    const total = [...word].reduce((n, ch) => n + FONT[ch][0].length, 0) + word.length - 1;
    let x = (25 - total) / 2;
    [...word].forEach((ch, li) => {
      const k = wi*5 + li, rows = FONT[ch];
      rows.forEach((row, r) => [...row].forEach((on, c) => {
        if (on !== '#') return;
        const b = document.createElement('div'); b.className = 'blk'; b.dataset.k = k;
        // bottom rows land first so each letter stacks up
        b.style.cssText = `left:calc(var(--px) * ${x + c});top:calc(var(--px) * ${r});` +
          `--r:${Math.round((rand()-.5)*120)}deg;animation-delay:${k*85 + (4-r)*40}ms`;
        grp.appendChild(b);
      }));
      x += rows[0].length + 1;
    });
    logo.appendChild(grp);
  });
  paintHome();
}
// A heap of bricks along the bottom of the home screen
function buildPile(){
  const pile = $('pile'); pile.innerHTML = '';
  const s = 40, cols = Math.ceil(innerWidth / s) + 1, heights = [];
  for (let c = 0; c < cols; c++){
    const h = 1 + (rand() < .6 ? 1 : 0) + (rand() < .25 ? 1 : 0);
    heights.push(h);
    for (let r = 0; r < h; r++){
      const b = document.createElement('div'); b.className = 'blk';
      b.style.cssText = `width:${s-3}px;height:${s-3}px;left:${c*s - 12 + (rand()-.5)*6}px;bottom:${r*(s-4) - 14}px;` +
        `transform:rotate(${Math.round((rand()-.5)*10)}deg)`;
      pile.appendChild(b);
    }
  }
}
function paintHome(){
  const cols = themeColors();
  document.querySelectorAll('#logo .blk').forEach(b => b.style.setProperty('--col', cols[b.dataset.k % cols.length]));
  document.querySelectorAll('#pile .blk').forEach(b => b.style.setProperty('--col', pick(cols)));
}
buildPile();
function inProgress(){ return S && !S.over && (S.score > 0 || S.grid.some(Boolean)); }
// Is there an unfinished classic game to continue?
const played = st => !!st && (st.score > 0 || st.grid.some(Boolean));
const classicInProgress = () => modeOf() === 'classic' ? inProgress() : played(loadSaved('classic'));
function showHome(){
  if (S) save();
  $('homeBest').textContent = +store.get('bs-best') || 0;
  $('playLabel').textContent = classicInProgress() ? 'CONTINUE' : 'PLAY';
  $('newBtn').style.display = classicInProgress() ? '' : 'none';
  const streak = streakNow();
  $('dailyBtn').classList.toggle('done', dailyDone());
  $('dailySub').textContent = dailyDone() ? `${streak}-day streak` : (played(loadSaved('daily')) ? 'Continue' : (streak ? `${streak}-day streak` : 'New deal every day'));
  const tb = +store.get(bestKey('timed')) || 0;
  $('timedSub').textContent = played(loadSaved('timed')) ? 'Continue' : (tb ? `Best ${tb}` : '2 minutes');
  $('zenSub').textContent = played(loadSaved('zen')) ? 'Continue' : 'No game over';
  homeEl.classList.remove('leave');
  homeEl.classList.add('show');
  buildLogo();
}
function leaveHome(){
  homeEl.classList.add('leave');
  setTimeout(() => { homeEl.classList.remove('show','leave'); renderTray(); }, 330);
}
function play(mode){
  if (!switchTo(mode)) return;
  leaveHome();
  if (!store.get('bs-seen')) setTimeout(showHelp, 360);
}
$('playBtn').onclick = () => play('classic');
$('dailyBtn').onclick = () => play('daily');
$('timedBtn').onclick = () => play('timed');
$('zenBtn').onclick = () => play('zen');
$('newBtn').onclick = () => { if (S) save(); newGame('classic'); leaveHome(); };
$('statsBtn').onclick = showStats;
$('howBtn').onclick = showHelp;
function showSettings(){
  const row = (id, label, on) => `<button class="setrow" id="${id}"><span>${label}</span><span class="tog ${on ? 'on' : ''}"><i></i></span></button>`;
  showOv(`<h2>Settings</h2>
    ${row('soundTog', 'Sound', soundOn())}
    ${row('musicTog', 'Music', musicOn())}
    ${row('vibeTog', 'Vibration', vibeOn())}
    <button class="btn" id="setDone">Done</button>`);
  $('soundTog').onclick = () => {
    store.set('bs-sound', soundOn() ? 'off' : 'on');
    $('soundTog').querySelector('.tog').classList.toggle('on', soundOn());
    SFX.tap();
  };
  $('musicTog').onclick = () => {
    store.set('bs-music', musicOn() ? 'off' : 'on');
    $('musicTog').querySelector('.tog').classList.toggle('on', musicOn());
    SFX.init(); SFX.musicSync();
  };
  $('vibeTog').onclick = () => {
    store.set('bs-vibe', vibeOn() ? 'off' : 'on');
    $('vibeTog').querySelector('.tog').classList.toggle('on', vibeOn());
  };
  $('setDone').onclick = hideOv;
}
$('setBtn').onclick = showSettings;
$('homeBtn').onclick = showHome;

function showHelp(){
  showOv(`<h2>Block Smash</h2>
    <ul>
      <li>Drag pieces onto the board.</li>
      <li>Fill a row or column to clear it. Keep clearing for combos.</li>
      <li>Every line charges your <b style="color:var(--yellow)">SMASH</b>. At ${SMASH_MAX} lines, blow up any 2×2 area.</li>
      <li>Game ends when nothing fits and your smash isn't charged.</li>
      <li><b>Daily:</b> one game a day, and everyone gets the same pieces. Keep your streak going.</li>
      <li><b>Timed:</b> score as much as you can in 2 minutes.</li>
      <li><b>Zen:</b> no game over. When you're stuck the hand reshuffles.</li>
    </ul>
    <p><b style="color:#fff">The honest dealer:</b> pieces are purely random. It only re-deals if a piece wouldn't fit anywhere. It never looks at your score. No ads, ever.</p>
    <button class="btn" id="ok">Let's go</button>`);
  $('ok').onclick = () => { store.set('bs-seen','1'); hideOv(); };
}
$('restartBtn').onclick = () => {
  showOv(`<h2>Start over?</h2><p>Your current score is ${S.score}.</p>
    <button class="btn" id="yes">New game</button><button class="btn alt" id="no">Keep playing</button>`);
  $('yes').onclick = () => newGame(modeOf()); $('no').onclick = hideOv;
};

// ---------- Smash ----------
let smashArmed = false, smashCell = null;
$('smash').onclick = () => {
  if (smashArmed){ smashArmed=false; clearMarks(); hint(''); render(); return; }
  if (S.meter < SMASH_MAX || S.over) return;
  smashArmed = true; hint('Tap the board to smash a 2×2 area'); render();
};
// Picks the 2x2 centred on the grid corner nearest your finger
function smashFromPoint(x, y){
  const g = boardGeom();
  const fx = (x - g.x + (g.pitch-g.size)/2) / g.pitch, fy = (y - g.y + (g.pitch-g.size)/2) / g.pitch;
  if (fx < -0.5 || fy < -0.5 || fx > N+0.5 || fy > N+0.5) return null;
  const clamp = v => Math.max(0, Math.min(N-2, v));
  return [clamp(Math.round(fy)-1), clamp(Math.round(fx)-1)];
}
function markSmash(rc){
  clearMarks();
  if (!rc) return;
  for (let r=rc[0];r<=rc[0]+1;r++) for (let c=rc[1];c<=rc[1]+1;c++) cellEls[r*N+c].classList.add('target');
}
function clearMarks(){ cellEls.forEach((el, i) => {
  if (el.classList.contains('will') && S.grid[i]) el.style.setProperty('--col', S.grid[i]);  // back to its own colour
  el.classList.remove('ghost','will','target');
}); }
boardEl.addEventListener('pointerdown', e => {
  if (!smashArmed) return;
  boardEl.setPointerCapture(e.pointerId);
  smashCell = smashFromPoint(e.clientX, e.clientY); markSmash(smashCell);
});
boardEl.addEventListener('pointermove', e => {
  if (!smashArmed || !smashCell) return;
  smashCell = smashFromPoint(e.clientX, e.clientY); markSmash(smashCell);
});
boardEl.addEventListener('pointerup', e => {
  if (!smashArmed || !smashCell) return;
  const rc = smashCell; smashCell = null; clearMarks();
  smashAt(rc[0], rc[1]);
});

// ---------- Dragging ----------
let drag = null, busy = false;
const LIFT = 60;     // piece floats above your finger so you can see it
const SPEED = 1.4;   // piece travels faster than your finger, so short flicks reach the whole board
const SNAP = 0.8;    // how far (in cells) a drop can be from a fitting spot and still snap into it
const setFloat = (x, y, k) => { floatEl.style.transform = `translate3d(${x}px,${y}px,0) scale(${k})`; };

trayEl.addEventListener('pointerdown', e => {
  if (smashArmed || S.over || busy || drag) return;
  const slot = e.target.closest('.slot'); if (!slot) return;
  const i = +slot.dataset.i, p = S.hand[i]; if (!p) return;
  const g = boardGeom(), gap = g.pitch - g.size;
  floatEl.innerHTML = '';
  for (const [r,c] of p.cells){
    const b=document.createElement('div'); b.className='blk';
    b.style.cssText = `--col:${p.color};width:${g.size}px;height:${g.size}px;left:${c*g.pitch}px;top:${r*g.pitch}px`;
    floatEl.appendChild(b);
  }
  const w = p.w*g.pitch - gap, h = p.h*g.pitch - gap;
  const pieceEl = slot.querySelector('.piece'), pr = pieceEl.getBoundingClientRect();
  drag = {
    i, p, g, w, h, slot, id: e.pointerId,
    x0: e.clientX, y0: e.clientY,                       // where your finger went down
    ox: e.clientX - w/2, oy: e.clientY - h - LIFT,      // where the piece starts (just above your finger)
    home: { x: pr.left + pr.width/2 - w/2, y: pr.top + pr.height/2 - h/2, k: pr.width / w },
    x: e.clientX, y: e.clientY, k: pr.width / w, t0: performance.now(), key: null, r: null, c: null, raf: 0,
  };
  slot.classList.remove('new');
  slot.classList.add('lifted');
  SFX.pick();
  floatEl.style.transition = 'none';
  floatEl.style.transformOrigin = '50% 50%';
  floatEl.style.display = 'block';
  trayEl.setPointerCapture(e.pointerId);
  frame();
});
trayEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.raf) drag.raf = requestAnimationFrame(frame);
});
trayEl.addEventListener('pointerup', e => { if (drag && e.pointerId===drag.id) endDrag(); });
trayEl.addEventListener('pointercancel', () => { if (drag) { drag.r = null; endDrag(); } });

// One update per screen frame, however many touch events arrive
function frame(){
  if (!drag) return;
  drag.raf = 0;
  const {g, p} = drag;
  const left = drag.ox + (drag.x - drag.x0) * SPEED;
  const top  = drag.oy + (drag.y - drag.y0) * SPEED;
  // Grow from tray size to board size over the first moment of the pick-up
  const t = Math.min(1, (performance.now() - drag.t0) / 110), ease = 1 - Math.pow(1 - t, 3);
  setFloat(left, top, drag.home.k + (1 - drag.home.k) * ease);
  if (t < 1) drag.raf = requestAnimationFrame(frame);

  // Nearest spot the piece fits, within SNAP cells
  const fr = (top - g.y) / g.pitch, fc = (left - g.x) / g.pitch;
  let spot = null, bestD = SNAP * SNAP;
  for (const r of [Math.floor(fr), Math.ceil(fr)]) for (const c of [Math.floor(fc), Math.ceil(fc)]){
    const d = (r - fr) ** 2 + (c - fc) ** 2;
    if (d <= bestD && canPlace(p, r, c)){ bestD = d; spot = [r, c]; }
  }
  const key = spot ? spot[0] * 16 + spot[1] : null;
  if (key === drag.key) return;
  drag.key = key;
  clearMarks();
  if (spot){
    const [r, c] = spot; drag.r = r; drag.c = c;
    for (const [dr,dc] of p.cells){ const el=cellEls[(r+dr)*N+c+dc]; el.classList.add('ghost'); el.style.setProperty('--col', p.color); }
    // lines this move would clear light up in the piece's colour
    linesAfter(p, r, c).cells.forEach(idx => { const el = cellEls[idx]; el.classList.add('will'); el.style.setProperty('--col', p.color); });
    buzz(4);
  } else { drag.r = null; drag.c = null; }
}

function endDrag(){
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  clearMarks();
  busy = true;
  floatEl.style.transition = 'transform .09s ease-out';
  if (d.r !== null){
    // Glide into the slot, then land
    setFloat(d.g.x + d.c * d.g.pitch, d.g.y + d.r * d.g.pitch, 1);
    setTimeout(() => { floatEl.style.display = 'none'; busy = false; place(d.i, d.r, d.c); }, 90);
  } else {
    // Doesn't fit: slide back to the tray
    floatEl.style.transition = 'transform .16s ease-out';
    setFloat(d.home.x, d.home.y, d.home.k);
    SFX.deny();
    setTimeout(() => { floatEl.style.display = 'none'; busy = false; render(); }, 160);
  }
}

window.addEventListener('resize', () => S && renderTray());

// ---------- Timed mode clock ----------
let clockLast = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(now - clockLast, 500); clockLast = now;
  if (!S || modeOf() !== 'timed' || S.over) return;
  if (homeEl.classList.contains('show') || $('ov').classList.contains('show') || document.hidden) return;
  const before = Math.ceil(S.timeLeft / 1000);
  S.timeLeft = Math.max(0, S.timeLeft - dt);
  const after = Math.ceil(S.timeLeft / 1000);
  if (after !== before){ renderModeTag(); if (after <= 10 && after > 0) SFX.tick(); if (after % 5 === 0) save(); }
  if (S.timeLeft <= 0){
    if (drag){ cancelAnimationFrame(drag.raf); drag = null; floatEl.style.display = 'none'; }
    S.over = true; smashArmed = false; clearMarks(); recordEnd(); render();
    gameOverSequence("TIME'S UP!");
  }
}, 200);

// ---------- Boot ----------
try {
  const saved = JSON.parse(store.get('bs-state'));
  if (saved && saved.grid && saved.grid.length===N*N && saved.hand && !saved.over) S = saved;
} catch {}
if (!S) { S = fresh(); S.hand = dealHand(); }
S.mode = S.mode || 'classic';
loadBest();
shownScore = S.score;
render();
afterMove();
if (S.over){ S = fresh(); S.hand = dealHand(); shownScore = 0; save(); render(); }
hideOv();
showHome();

// ---------- Updates ----------
// Bump VERSION and version.json together on every release.
const VERSION = '3.0';
$('ver').textContent = 'v' + VERSION;
// Wipes the offline copy (never your scores) and reloads the latest version
async function forceUpdate(){
  $('updBtn').textContent = 'Updating…';
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
  } catch {}
  location.replace('./?v=' + Date.now());
}
$('updBtn').onclick = forceUpdate;
// Asks the server which version is live; offline just means no check
async function checkForUpdate(){
  try {
    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const live = (await res.json()).version;
    if (live && live !== VERSION) $('updBtn').style.display = '';
  } catch {}
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    // Home-screen apps resume instead of relaunching, so check again whenever the app comes back
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible'){ reg.update().catch(()=>{}); checkForUpdate(); }
    });
  }).catch(()=>{});
}
checkForUpdate();
</script>
