<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#161936">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Smash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Block Smash</title>
<style>
:root{
  --text:#ffffff;--muted:#9aa0d6;--gold:#ffc83d;--gold-dk:#e08a00;--red:#ff4d6d;
  --gap:5px;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;color:var(--text);font-family:var(--font);
  background:#0d0f22;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{background:
  radial-gradient(120% 70% at 50% -5%, #3a3f8f 0%, rgba(58,63,143,0) 60%),
  radial-gradient(90% 60% at 50% 110%, #2a1d5e 0%, rgba(42,29,94,0) 70%),
  linear-gradient(180deg,#1b1e45 0%,#12142f 60%,#0d0f22 100%)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;
  max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px)}

/* ---------- Header ---------- */
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.bestpill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:999px;padding:6px 12px 6px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.bestpill svg{width:20px;height:20px}
#best{font-weight:900;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.iconbtn{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:12px;width:38px;height:38px;
  font:900 18px var(--font);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#score{font-size:58px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  text-shadow:0 4px 0 rgba(0,0,0,.3),0 10px 24px rgba(0,0,0,.35)}
#score.bump{animation:bump .25s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}

/* ---------- Board ---------- */
#board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:var(--gap);padding:8px;
  width:min(100%,52vh);aspect-ratio:1;border-radius:20px;
  background:linear-gradient(180deg,#151838 0%,#0f1129 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.5),inset 0 3px 10px rgba(0,0,0,.6)}
.c{position:relative;border-radius:22%;background:rgba(255,255,255,.045);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.04)}

/* The block look: glossy bevel with a shine */
.f,.blk,.burst{
  background:var(--col);
  background:linear-gradient(160deg,color-mix(in srgb,var(--col) 45%,#fff) 0%,var(--col) 42%,color-mix(in srgb,var(--col) 72%,#000) 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.28),
             inset 3px 0 0 rgba(255,255,255,.12),inset -3px 0 0 rgba(0,0,0,.14),0 3px 4px rgba(0,0,0,.4)}
.f::after,.blk::after,.burst::after{content:'';position:absolute;left:16%;top:11%;width:40%;height:20%;
  border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.15))}
.ghost{background:var(--col);opacity:.38;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.will{filter:brightness(1.3) saturate(1.2)}
.will::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px #fff;z-index:1}
.target{background:rgba(255,77,109,.35);box-shadow:inset 0 0 0 3px var(--red)}
.target.f{filter:brightness(.75) sepia(.4) hue-rotate(-20deg)}
.land{animation:land .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.18)}100%{transform:scale(1)}}
#board.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* Effects layer */
#fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.burst{position:absolute;border-radius:22%;animation:burst .5s ease-out both}
@keyframes burst{0%{transform:scale(1)}25%{transform:scale(1.25);filter:brightness(2.2)}100%{transform:scale(0) rotate(70deg);opacity:0}}
.spark{position:absolute;border-radius:3px;background:var(--col);animation:spark .75s cubic-bezier(.2,.7,.4,1) both;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(var(--rot));opacity:0}}
.flash{position:absolute;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 20%,#fff 80%,rgba(255,255,255,0));
  animation:flash .42s ease-out both}
.flash.v{background:linear-gradient(180deg,rgba(255,255,255,0),#fff 20%,#fff 80%,rgba(255,255,255,0))}
@keyframes flash{0%{opacity:.95}100%{opacity:0;transform:scale(1.08)}}
.ring{position:absolute;border-radius:50%;border:6px solid var(--gold);animation:ring .55s ease-out both}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.4);opacity:0;border-width:1px}}

#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);pointer-events:none;z-index:4;
  text-align:center;opacity:0;white-space:nowrap}
#toast .w{display:block;font-size:44px;font-weight:900;letter-spacing:.02em;color:#fff;
  -webkit-text-stroke:2px #8a3a00;paint-order:stroke fill;
  background:linear-gradient(180deg,#fff6c9 0%,#ffc83d 55%,#ff8a1f 100%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
#toast .p{display:block;font-size:26px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#toast .c{display:inline-block;margin:6px 0 2px;padding:4px 14px;border-radius:999px;font-size:20px;font-weight:900;color:#fff;
  letter-spacing:.06em;background:linear-gradient(180deg,#ff8a5c,#ff3d6e);box-shadow:0 4px 0 #9c1438,inset 0 2px 0 rgba(255,255,255,.45)}
#toast.t1 .w{background-image:linear-gradient(180deg,#ffffff 0%,#b9f3ff 55%,#3fc7ff 100%);-webkit-text-stroke-color:#0d4a7a}
#toast.t3 .w{background-image:linear-gradient(180deg,#fff0f5 0%,#ff8ac4 50%,#ff3d6e 100%);-webkit-text-stroke-color:#7a0d3a}
#toast.t4 .w{background-image:linear-gradient(180deg,#f4e9ff 0%,#c58cff 50%,#7a3dff 100%);-webkit-text-stroke-color:#2e0d7a}
#toast.t5 .w{background-image:linear-gradient(90deg,#ff5d5d,#ffc83d,#2fd67b,#2f9bff,#c58cff);-webkit-text-stroke-color:#1b1450;font-size:50px}
#toast.t4 .w,#toast.t5 .w{animation:wobble .5s .15s}
@keyframes wobble{25%{transform:rotate(-5deg) scale(1.1)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.scorewrap{position:relative;display:flex;justify-content:center}
#comboPill{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;
  padding:5px 11px;border-radius:999px;font-size:15px;font-weight:900;letter-spacing:.05em;color:#fff;
  background:linear-gradient(180deg,#ff8a5c,#ff3d6e);box-shadow:0 3px 0 #9c1438,inset 0 2px 0 rgba(255,255,255,.45);
  opacity:0;transition:opacity .2s}
#comboPill.on{opacity:1}
#comboPill.pop{animation:pillpop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes pillpop{0%{transform:translateY(-50%) scale(.6)}100%{transform:translateY(-50%) scale(1)}}
#toast.show{animation:rise 1.1s ease-out}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-85%) scale(1)}}

/* ---------- Smash meter ---------- */
#smashbar{width:min(100%,52vh);display:flex;align-items:center;gap:10px}
#meter{flex:1;position:relative;height:16px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
#fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;transform-origin:left center;transform:scaleX(0);
  background:linear-gradient(180deg,#ffe58a 0%,#ffc83d 45%,#f08c00 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#meter::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.35) calc(10% - 2px) 10%)}
#smash{border:0;border-radius:14px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:6px;
  font:900 15px var(--font);letter-spacing:.06em;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
#smash svg{width:20px;height:20px}
#smash.ready{color:#5a2b00;background:linear-gradient(180deg,#ffe58a,#ffc83d 50%,#f39c12);
  box-shadow:0 4px 0 #a85d00,inset 0 2px 0 rgba(255,255,255,.6);animation:throb .7s infinite alternate ease-in-out}
#smash.ready svg{opacity:1}
#smash.armed{color:#fff;background:linear-gradient(180deg,#ff7a90,#ff4d6d 50%,#d92b4b);box-shadow:0 4px 0 #8c1129;animation:none}
#smash.armed svg{opacity:1}
#smash:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
@keyframes throb{from{transform:scale(1)}to{transform:scale(1.07)}}
#hint{min-height:18px;font-size:14px;color:var(--gold);font-weight:800;text-align:center}

/* ---------- Tray ---------- */
#tray{width:100%;flex:1;min-height:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:grid;place-items:center;position:relative}
.piece{position:relative;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transition:opacity .2s,transform .2s}
.piece .blk{position:absolute;border-radius:22%}
.slot.dead .piece{opacity:.3;filter:grayscale(.8)}
.slot.lifted .piece{opacity:0}
.slot.new .piece{animation:deal .35s cubic-bezier(.3,1.5,.5,1) both}
.slot:nth-child(2).new .piece{animation-delay:.06s}
.slot:nth-child(3).new .piece{animation-delay:.12s}
@keyframes deal{0%{transform:translateY(40px) scale(.4);opacity:0}100%{transform:none;opacity:1}}

#float{position:fixed;left:0;top:0;pointer-events:none;z-index:10;display:none;
  filter:drop-shadow(0 14px 12px rgba(0,0,0,.45))}
#float .blk{position:absolute;border-radius:22%}

/* ---------- Overlay ---------- */
#ov{position:fixed;inset:0;background:rgba(8,9,24,.78);display:none;place-items:center;z-index:20;padding:24px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ov.show{display:grid}
.card{background:linear-gradient(180deg,#2c3170 0%,#1c1f4a 100%);border-radius:24px;padding:28px 22px 22px;max-width:360px;width:100%;
  text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 24px 50px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.12);
  animation:cardin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardin{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.card h2{font-size:32px;font-weight:900;margin-bottom:6px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.card p{color:var(--muted);font-size:15px;line-height:1.45;margin:8px 0;font-weight:600}
.card .label{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}
.card .big{font-size:64px;font-weight:900;margin:2px 0;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.card ul{text-align:left;color:#d6d9ff;font-size:15px;line-height:1.5;margin:12px 0 6px 18px;font-weight:600}
.card li{margin:4px 0}
.btn{border:0;border-radius:16px;padding:15px 20px;font:900 18px var(--font);margin-top:16px;width:100%;
  color:#5a2b00;background:linear-gradient(180deg,#ffe58a,#ffc83d 50%,#f39c12);
  box-shadow:0 5px 0 #a85d00,inset 0 2px 0 rgba(255,255,255,.6)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a85d00}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
/* ---------- Home ---------- */
#home{position:fixed;inset:0;z-index:15;display:none;place-items:center;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% -5%, #3a3f8f 0%, rgba(58,63,143,0) 60%),
    radial-gradient(90% 60% at 50% 110%, #2a1d5e 0%, rgba(42,29,94,0) 70%),
    linear-gradient(180deg,#1b1e45 0%,#12142f 60%,#0d0f22 100%)}
#home.show{display:grid}
#home.leave{animation:homeout .35s ease-in forwards}
@keyframes homeout{to{opacity:0;transform:scale(1.08)}}
#rain{position:absolute;inset:0;pointer-events:none}
#rain .blk{position:absolute;top:-90px;border-radius:22%;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(calc(100vh + 180px)) rotate(var(--r))}}
.hwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;text-align:center}
.title{line-height:.92;font-weight:900;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center}
.title .word{display:block;white-space:nowrap}
.title .l{display:inline-block;font-size:clamp(56px,18vw,96px);
  -webkit-text-stroke:3px #1b1450;paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));
  animation:dropin .65s cubic-bezier(.3,1.6,.5,1) both,bob 2.6s ease-in-out infinite}
.w1 .l{color:#fff;background:linear-gradient(180deg,#ffffff 0%,#cfe3ff 55%,#7fb2ff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.w2 .l{background:linear-gradient(180deg,#fff6c9 0%,#ffc83d 50%,#ff7a1a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.w2{animation:smack 3.2s 1.4s infinite}
@keyframes dropin{0%{transform:translateY(-120px) scale(.4) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes smack{0%,86%,100%{transform:none}88%{transform:scale(1.12) rotate(-3deg)}91%{transform:scale(.96) rotate(2deg)}94%{transform:scale(1.04)}}
.hbest{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border-radius:999px;padding:10px 20px 10px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);animation:fadeup .5s .7s both}
.hbest svg{width:26px;height:26px}
.hbest .lbl{font-size:13px;letter-spacing:.16em;color:var(--muted);font-weight:900}
.hbest b{font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
.playbtn{border:0;border-radius:28px;padding:22px 64px;margin-top:6px;display:flex;align-items:center;gap:14px;
  font:900 34px var(--font);letter-spacing:.06em;color:#5a2b00;
  background:linear-gradient(180deg,#ffe58a,#ffc83d 50%,#f39c12);
  box-shadow:0 8px 0 #a85d00,0 18px 30px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.65);
  animation:fadeup .5s .85s both,pulse 1.4s 1.4s infinite ease-in-out}
.playbtn svg{width:30px;height:30px}
.playbtn:active{transform:translateY(6px) !important;box-shadow:0 2px 0 #a85d00,inset 0 3px 0 rgba(255,255,255,.65)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fadeup{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
.links{display:flex;gap:10px;animation:fadeup .5s 1s both}
.linkbtn{border:0;background:rgba(255,255,255,.1);color:#fff;font:800 15px var(--font);padding:11px 18px;border-radius:14px;
  box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.linkbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tag{color:var(--muted);font-weight:700;font-size:14px;animation:fadeup .5s 1.1s both}
.btn.alt{color:#fff;background:linear-gradient(180deg,#5a61b8,#3d4390);box-shadow:0 5px 0 #23275e,inset 0 2px 0 rgba(255,255,255,.25);margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bestpill">
      <svg viewBox="0 0 24 24"><path fill="#ffc83d" stroke="#a85d00" stroke-width="1.5" stroke-linejoin="round" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>
      <span id="best">0</span>
    </div>
    <div class="row">
      <button class="iconbtn" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3.2 2.5 11h2.7v9h5.3v-6h3v6h5.3v-9h2.7z"/></svg></button>
      <button class="iconbtn" id="restartBtn" aria-label="New game">↻</button>
    </div>
  </div>
  <div class="scorewrap"><div id="score">0</div><div id="comboPill"></div></div>

  <div id="board"><div id="fx"></div><div id="toast"></div></div>

  <div id="smashbar">
    <div id="meter"><div id="fill"></div></div>
    <button id="smash"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="14" r="7" fill="currentColor"/><circle cx="8" cy="11.5" r="2" fill="rgba(255,255,255,.5)"/><path d="M15 8.5l2.5-2.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 2.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="#ff4d6d"/></svg><span id="smashLabel">SMASH</span></button>
  </div>
  <div id="hint"></div>

  <div id="tray"></div>
</div>
<div id="float"></div>
<div id="home">
  <div id="rain"></div>
  <div class="hwrap">
    <h1 class="title"><span class="word w1">BLOCK</span><span class="word w2">SMASH</span></h1>
    <div class="hbest">
      <svg viewBox="0 0 24 24"><path fill="#ffc83d" stroke="#a85d00" stroke-width="1.5" stroke-linejoin="round" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>
      <span class="lbl">BEST</span><b id="homeBest">0</b>
    </div>
    <button class="playbtn" id="playBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><span id="playLabel">PLAY</span></button>
    <div class="links">
      <button class="linkbtn" id="newBtn">New game</button>
      <button class="linkbtn" id="howBtn">How to play</button>
    </div>
    <p class="tag">No ads. No revives. Just you.</p>
  </div>
</div>
<div id="ov"><div class="card" id="card"></div></div>

<script>
'use strict';
const N = 8, SMASH_MAX = 10;
const COLORS = ['#ff4d5e','#ffb81f','#2fd67b','#2f9bff','#8c5cff','#ff5fb8','#ff7a1a','#1fd1d6'];

// ---------- Pieces ----------
// Base shapes ('#' = block, '|' = new row) with a weight. All rotations are generated.
const BASE = [
  ['#',1], ['##',2], ['###',2], ['####',2], ['#####',2],
  ['##|##',3], ['###|###',3], ['###|###|###',3],
  ['#.|##',2], ['#.|#.|##',2], ['.#|.#|##',2],
  ['###|.#.',2], ['##.|.##',1], ['.##|##.',1], ['#..|#..|###',3],
];
const parse = s => { const out=[]; s.split('|').forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==='#') out.push([r,c]); })); return out; };
const norm = cells => {
  const mr=Math.min(...cells.map(p=>p[0])), mc=Math.min(...cells.map(p=>p[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot = cells => norm(cells.map(([r,c])=>[c,-r]));
const SHAPES = BASE.map(([s,w]) => {
  const seen=new Set(), orients=[]; let cur=norm(parse(s));
  for (let i=0;i<4;i++){ const k=JSON.stringify(cur); if(!seen.has(k)){seen.add(k);orients.push(cur);} cur=rot(cur); }
  return {orients, w};
});
const TOTAL_W = SHAPES.reduce((a,s)=>a+s.w,0);

// ---------- The honest dealer ----------
// Uniform randomness from the OS. It never looks at your score, your history, or anything else.
const rand = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
const pick = arr => arr[Math.floor(rand()*arr.length)];
function randomPiece(){
  let x = rand()*TOTAL_W, shape = SHAPES[0];
  for (const s of SHAPES){ if ((x -= s.w) < 0){ shape = s; break; } }
  const cells = pick(shape.orients);
  return { cells, h: Math.max(...cells.map(p=>p[0]))+1, w: Math.max(...cells.map(p=>p[1]))+1, color: pick(COLORS) };
}
// Fair-hand rule: re-deal (randomly) until every piece fits somewhere on the board.
// It never chooses pieces to help or hurt you. If no fair hand turns up, you get a random one.
function dealHand(){
  let hand;
  for (let i=0;i<60;i++){
    hand = [randomPiece(), randomPiece(), randomPiece()];
    if (hand.every(fitsAnywhere)) return hand;
  }
  return hand;
}

// ---------- State ----------
let S;
function fresh(){ return { grid: Array(N*N).fill(null), hand: null, score: 0, meter: 0, combo: 0, since: 0, over: false, startBest: best, nb: false }; }
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let best = +store.get('bs-best') || 0;
function save(){ store.set('bs-state', JSON.stringify(S)); if (S.score > best){ best = S.score; store.set('bs-best', best); } }

const at = (r,c) => S.grid[r*N+c];
function canPlace(p, r, c){
  for (const [dr,dc] of p.cells){
    const rr=r+dr, cc=c+dc;
    if (rr<0||cc<0||rr>=N||cc>=N||at(rr,cc)) return false;
  }
  return true;
}
function fitsAnywhere(p){
  for (let r=0;r<=N-p.h;r++) for (let c=0;c<=N-p.w;c++) if (canPlace(p,r,c)) return true;
  return false;
}
// Which rows/cols would clear if p were placed at r,c
function linesAfter(p, r, c){
  const g = S.grid.slice();
  for (const [dr,dc] of p.cells) g[(r+dr)*N + c+dc] = 1;
  const out = new Set(), rows = [], cols = [];
  for (let i=0;i<N;i++){
    let row=true, col=true;
    for (let j=0;j<N;j++){ if(!g[i*N+j]) row=false; if(!g[j*N+i]) col=false; }
    if (row){ rows.push(i); for(let j=0;j<N;j++) out.add(i*N+j); }
    if (col){ cols.push(i); for(let j=0;j<N;j++) out.add(j*N+i); }
  }
  return {cells: out, lines: rows.length + cols.length, rows, cols};
}

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const boardEl=$('board'), trayEl=$('tray'), floatEl=$('float'), toastEl=$('toast'), fxEl=$('fx');
const cellEls = [];
for (let i=0;i<N*N;i++){ const d=document.createElement('div'); d.className='c'; boardEl.appendChild(d); cellEls.push(d); }
const slots = [0,1,2].map(i => { const d=document.createElement('div'); d.className='slot'; d.dataset.i=i; trayEl.appendChild(d); return d; });

function boardGeom(){
  const a=cellEls[0].getBoundingClientRect(), b=cellEls[1].getBoundingClientRect();
  return { x:a.left, y:a.top, size:a.width, pitch:b.left-a.left };
}

// Score counts up rather than jumping
let shownScore = 0, scoreRaf = 0;
function animateScore(){
  cancelAnimationFrame(scoreRaf);
  const from = shownScore, to = S.score, t0 = performance.now(), dur = Math.min(600, 150 + (to-from)*4);
  if (to > from + 5){ const el=$('score'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const step = t => {
    const k = Math.min(1, (t - t0) / dur);
    shownScore = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('score').textContent = shownScore;
    if (k < 1) scoreRaf = requestAnimationFrame(step);
  };
  if (to <= from){ shownScore = to; $('score').textContent = to; } else scoreRaf = requestAnimationFrame(step);
}

let lastHandKey = '';
function render(){
  S.grid.forEach((col,i)=>{
    const el=cellEls[i];
    el.className = col ? 'c f' : 'c';
    if (col) el.style.setProperty('--col', col); else el.style.removeProperty('--col');
  });
  animateScore();
  renderCombo();
  $('best').textContent = Math.max(best, S.score);
  $('fill').style.transform = `scaleX(${S.meter / SMASH_MAX})`;
  const sb=$('smash');
  sb.className = smashArmed ? 'armed' : (S.meter>=SMASH_MAX ? 'ready' : '');
  $('smashLabel').textContent = smashArmed ? 'CANCEL' : (S.meter>=SMASH_MAX ? 'SMASH' : `${S.meter}/${SMASH_MAX}`);
  renderTray();
}
function renderTray(){
  const g = boardGeom();
  const key = JSON.stringify(S.hand.map(p => p && p.cells.length));
  const fresh = S.hand.every(Boolean) && key !== lastHandKey;
  lastHandKey = key;
  slots.forEach((slot,i)=>{
    slot.innerHTML=''; slot.classList.remove('dead','lifted','new');
    const p = S.hand[i]; if (!p) return;
    const sw = slot.clientWidth, sh = slot.clientHeight;
    const size = Math.min(g.size*0.62, (sw-8)/5, (sh-8)/5);
    const gap = Math.max(2, size*0.1);
    const piece = document.createElement('div'); piece.className='piece';
    piece.style.width = (p.w*size + (p.w-1)*gap) + 'px';
    piece.style.height = (p.h*size + (p.h-1)*gap) + 'px';
    for (const [r,c] of p.cells){
      const b=document.createElement('div'); b.className='blk';
      b.style.cssText = `--col:${p.color};width:${size}px;height:${size}px;left:${c*(size+gap)}px;top:${r*(size+gap)}px`;
      piece.appendChild(b);
    }
    slot.appendChild(piece);
    if (fresh) slot.classList.add('new');
    if (!fitsAnywhere(p)) slot.classList.add('dead');
  });
}

let toastTimers = [];
function toast(word, pts, combo, tier){
  toastEl.innerHTML = (word ? `<span class="w">${word}</span>` : '') +
    (combo ? `<span class="c">${combo}</span>` : '') + (pts ? `<span class="p">${pts}</span>` : '');
  toastEl.className = tier ? 't' + tier : '';
  void toastEl.offsetWidth; toastEl.classList.add('show');
}
// Follow-up callouts (SMASH READY, NEW BEST) wait their turn after the main one
function laterToast(delay, ...args){ toastTimers.push(setTimeout(() => toast(...args), delay)); }
function clearToasts(){ toastTimers.forEach(clearTimeout); toastTimers = []; }
let lastCombo = 0;
function renderCombo(){
  const el = $('comboPill');
  if (S.combo >= 2){
    el.textContent = `COMBO x${S.combo}`;
    el.classList.add('on');
    if (S.combo !== lastCombo){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  } else el.classList.remove('on');
  lastCombo = S.combo;
}
function hint(text){ $('hint').textContent = text || ''; }
function shake(){ boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); }
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch {} }

// ---------- Game flow ----------
function place(i, r, c){
  const p = S.hand[i];
  for (const [dr,dc] of p.cells) S.grid[(r+dr)*N + c+dc] = p.color;
  S.score += p.cells.length;
  S.hand[i] = null;

  const {cells, lines, rows, cols} = linesAfter({cells:[], h:0, w:0}, 0, 0);
  const cleared = [];
  if (lines){
    clearToasts();
    S.combo++; S.since = 0;
    let pts = Math.round(10 * lines*(lines+1)/2 * (1 + (S.combo-1)*0.5));
    const wasReady = S.meter >= SMASH_MAX;
    S.meter = Math.min(SMASH_MAX, S.meter + lines);
    cells.forEach(idx => { cleared.push([idx, S.grid[idx]]); S.grid[idx] = null; });
    const allClear = S.grid.every(x => !x);
    if (allClear) pts += 300;
    S.score += pts;

    const WORDS = [[], ['GOOD!','NICE!','SWEET!'], ['GREAT!','DOUBLE!'], ['AMAZING!','TRIPLE!'], ['INCREDIBLE!','UNREAL!','QUAD!']];
    const tier = allClear ? 5 : Math.min(4, lines + (S.combo >= 4 ? 1 : 0));
    const word = allClear ? 'ALL CLEAR!' : pick(WORDS[Math.min(4, lines)]);
    toast(word, `+${pts}`, S.combo >= 2 ? `COMBO x${S.combo}` : '', tier);

    let wait = 1100;
    if (!wasReady && S.meter >= SMASH_MAX){ laterToast(wait, 'SMASH READY!', '', '', 2); wait += 1100; }
    if (!S.nb && S.startBest > 0 && S.score > S.startBest){ S.nb = true; laterToast(wait, 'NEW BEST!', '', '', 5); }
    if (lines >= 2 || S.combo >= 3 || allClear) shake();
    buzz(lines >= 2 ? [30,40,30] : 25);
  } else if (++S.since >= 3){ S.combo = 0; }

  if (S.hand.every(x=>!x)) S.hand = dealHand();
  const landed = p.cells.map(([dr,dc]) => (r+dr)*N + c+dc).filter(idx => S.grid[idx]);
  afterMove(cleared, { origin: [r + (p.h-1)/2, c + (p.w-1)/2], rows, cols, landed });
}

// Clear effects live on their own layer over the board, so the board itself is always up to date.
function effects(cleared, info){
  if (!cleared || !cleared.length) return;
  const nodes = [];
  const add = (cls, css) => { const d=document.createElement('div'); d.className=cls; d.style.cssText=css; fxEl.appendChild(d); nodes.push(d); };
  const box = el => ({ l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });
  for (const i of info.rows || []){
    const a = box(cellEls[i*N]), b = box(cellEls[i*N+N-1]);
    add('flash', `left:${a.l}px;top:${a.t}px;width:${b.l+b.w-a.l}px;height:${a.h}px`);
  }
  for (const i of info.cols || []){
    const a = box(cellEls[i]), b = box(cellEls[(N-1)*N+i]);
    add('flash v', `left:${a.l}px;top:${a.t}px;width:${a.w}px;height:${b.t+b.h-a.t}px`);
  }
  const [or, oc] = info.origin || [3.5, 3.5];
  if (info.ring){
    const a = box(cellEls[Math.floor(or)*N + Math.floor(oc)]), s = a.w*2;
    add('ring', `left:${a.l + a.w*(oc-Math.floor(oc)) + a.w/2 - s/2}px;top:${a.t + a.h*(or-Math.floor(or)) + a.h/2 - s/2}px;width:${s}px;height:${s}px`);
  }
  let maxDelay = 0;
  for (const [idx, col] of cleared){
    const r = Math.floor(idx/N), c = idx%N, b = box(cellEls[idx]);
    const delay = Math.round((Math.abs(r-or) + Math.abs(c-oc)) * 30);
    maxDelay = Math.max(maxDelay, delay);
    add('burst', `--col:${col};left:${b.l}px;top:${b.t}px;width:${b.w}px;height:${b.h}px;animation-delay:${delay}ms`);
    for (let k=0;k<4;k++){
      const ang = rand()*Math.PI*2, dist = 35 + rand()*80, s = 5 + rand()*7;
      add('spark', `--col:${col};left:${b.l+b.w/2-s/2}px;top:${b.t+b.h/2-s/2}px;width:${s}px;height:${s}px;` +
        `--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;--rot:${Math.round(rand()*360)}deg;animation-delay:${delay}ms`);
    }
  }
  setTimeout(() => nodes.forEach(n => n.remove()), 850 + maxDelay);
}

function afterMove(cleared, info){
  info = info || {};
  hint('');
  const anyFit = S.hand.some(p => p && fitsAnywhere(p));
  if (!anyFit){
    if (S.meter >= SMASH_MAX) hint('Out of moves — use your SMASH!');
    else S.over = true;
  }
  save(); render();
  for (const idx of info.landed || []) cellEls[idx].classList.add('land');
  effects(cleared, info);
  if (S.over) setTimeout(showGameOver, cleared && cleared.length ? 950 : 350);
}

// Smash clears a 2x2 area; r0,c0 is its top-left cell.
function smashAt(r0, c0){
  const cleared = [];
  for (let r=r0;r<=r0+1;r++) for (let c=c0;c<=c0+1;c++){
    if (r<0||c<0||r>=N||c>=N) continue;
    const idx=r*N+c; if (S.grid[idx]){ cleared.push([idx,S.grid[idx]]); S.grid[idx]=null; }
  }
  S.score += cleared.length * 5;
  S.meter = 0; smashArmed = false;
  shake(); buzz(70);
  toast('SMASH!', cleared.length ? `+${cleared.length*5}` : '');
  afterMove(cleared.length ? cleared : [[r0*N+c0, '#ffc83d']], { origin: [r0+0.5, c0+0.5], ring: true });
}

function newGame(){
  S = fresh(); S.hand = dealHand(); smashArmed=false; shownScore = 0;
  save(); hint(''); render(); hideOv();
}

// ---------- Overlay ----------
function showOv(html){ $('card').innerHTML = html; $('ov').classList.add('show'); }
function hideOv(){ $('ov').classList.remove('show'); }
function showGameOver(){
  if (!S.over || homeEl.classList.contains('show')) return;
  const isBest = S.score >= best && S.score > 0;
  showOv(`<div class="label">${isBest ? '★ New best ★' : 'Out of moves'}</div>
    <div class="big">${S.score}</div>
    <p>Best: ${best}</p>
    <p>No ads. No revives. That one was all you.</p>
    <button class="btn" id="again">Play again</button>
    <button class="btn alt" id="goHome">Home</button>`);
  $('again').onclick = newGame;
  $('goHome').onclick = () => { hideOv(); showHome(); };
}

// ---------- Home ----------
const homeEl = $('home');
// Title letters drop in one by one
document.querySelectorAll('.title .word').forEach((w, wi) => {
  w.innerHTML = [...w.textContent].map((ch, i) => {
    const d = wi*5*70 + i*70;
    return `<span class="l" style="animation-delay:${d}ms,${d+700}ms">${ch}</span>`;
  }).join('');
});
// Glossy blocks raining in the background
for (let i=0;i<16;i++){
  const b = document.createElement('div'), s = 22 + rand()*40;
  b.className = 'blk';
  b.style.cssText = `--col:${pick(COLORS)};--r:${Math.round(rand()*540-270)}deg;width:${s}px;height:${s}px;` +
    `left:${rand()*100}%;animation-duration:${7+rand()*9}s;animation-delay:${-rand()*16}s`;
  $('rain').appendChild(b);
}
function inProgress(){ return S && !S.over && (S.score > 0 || S.grid.some(Boolean)); }
function showHome(){
  $('homeBest').textContent = Math.max(best, S ? S.score : 0);
  $('playLabel').textContent = inProgress() ? 'CONTINUE' : 'PLAY';
  $('newBtn').style.display = inProgress() ? '' : 'none';
  homeEl.classList.remove('leave');
  homeEl.classList.add('show');
}
function leaveHome(){
  homeEl.classList.add('leave');
  setTimeout(() => { homeEl.classList.remove('show','leave'); renderTray(); }, 330);
}
$('playBtn').onclick = () => {
  if (!inProgress()) newGame();
  leaveHome();
  if (!store.get('bs-seen')) setTimeout(showHelp, 360);
};
$('newBtn').onclick = () => { newGame(); leaveHome(); };
$('howBtn').onclick = showHelp;
$('homeBtn').onclick = showHome;

function showHelp(){
  showOv(`<h2>Block Smash</h2>
    <ul>
      <li>Drag pieces onto the board.</li>
      <li>Fill a row or column to clear it. Keep clearing for combos.</li>
      <li>Every line charges your <b style="color:var(--gold)">SMASH</b>. At ${SMASH_MAX} lines, blow up any 2×2 area.</li>
      <li>Game ends when nothing fits and your smash isn't charged.</li>
    </ul>
    <p><b style="color:#fff">The honest dealer:</b> pieces are purely random. It only re-deals if a piece wouldn't fit anywhere. It never looks at your score. No ads, ever.</p>
    <button class="btn" id="ok">Let's go</button>`);
  $('ok').onclick = () => { store.set('bs-seen','1'); hideOv(); };
}
$('restartBtn').onclick = () => {
  showOv(`<h2>Start over?</h2><p>Your current score is ${S.score}.</p>
    <button class="btn" id="yes">New game</button><button class="btn alt" id="no">Keep playing</button>`);
  $('yes').onclick = newGame; $('no').onclick = hideOv;
};

// ---------- Smash ----------
let smashArmed = false, smashCell = null;
$('smash').onclick = () => {
  if (smashArmed){ smashArmed=false; clearMarks(); hint(''); render(); return; }
  if (S.meter < SMASH_MAX || S.over) return;
  smashArmed = true; hint('Tap the board to smash a 2×2 area'); render();
};
// Picks the 2x2 centred on the grid corner nearest your finger
function smashFromPoint(x, y){
  const g = boardGeom();
  const fx = (x - g.x + (g.pitch-g.size)/2) / g.pitch, fy = (y - g.y + (g.pitch-g.size)/2) / g.pitch;
  if (fx < -0.5 || fy < -0.5 || fx > N+0.5 || fy > N+0.5) return null;
  const clamp = v => Math.max(0, Math.min(N-2, v));
  return [clamp(Math.round(fy)-1), clamp(Math.round(fx)-1)];
}
function markSmash(rc){
  clearMarks();
  if (!rc) return;
  for (let r=rc[0];r<=rc[0]+1;r++) for (let c=rc[1];c<=rc[1]+1;c++) cellEls[r*N+c].classList.add('target');
}
function clearMarks(){ cellEls.forEach(el=>el.classList.remove('ghost','will','target')); }
boardEl.addEventListener('pointerdown', e => {
  if (!smashArmed) return;
  boardEl.setPointerCapture(e.pointerId);
  smashCell = smashFromPoint(e.clientX, e.clientY); markSmash(smashCell);
});
boardEl.addEventListener('pointermove', e => {
  if (!smashArmed || !smashCell) return;
  smashCell = smashFromPoint(e.clientX, e.clientY); markSmash(smashCell);
});
boardEl.addEventListener('pointerup', e => {
  if (!smashArmed || !smashCell) return;
  const rc = smashCell; smashCell = null; clearMarks();
  smashAt(rc[0], rc[1]);
});

// ---------- Dragging ----------
let drag = null;
const LIFT = 70; // piece floats above your finger so you can see it
trayEl.addEventListener('pointerdown', e => {
  if (smashArmed || S.over) return;
  const slot = e.target.closest('.slot'); if (!slot) return;
  const i = +slot.dataset.i, p = S.hand[i]; if (!p) return;
  const g = boardGeom(), gap = g.pitch - g.size;
  floatEl.innerHTML = '';
  for (const [r,c] of p.cells){
    const b=document.createElement('div'); b.className='blk';
    b.style.cssText = `--col:${p.color};width:${g.size}px;height:${g.size}px;left:${c*g.pitch}px;top:${r*g.pitch}px`;
    floatEl.appendChild(b);
  }
  const w = p.w*g.pitch - gap, h = p.h*g.pitch - gap;
  drag = { i, p, g, w, h, r:null, c:null, id:e.pointerId };
  slot.classList.remove('new');
  slot.classList.add('lifted');
  floatEl.style.display = 'block';
  trayEl.setPointerCapture(e.pointerId);
  moveDrag(e.clientX, e.clientY);
});
trayEl.addEventListener('pointermove', e => { if (drag && e.pointerId===drag.id) moveDrag(e.clientX, e.clientY); });
trayEl.addEventListener('pointerup', e => { if (drag && e.pointerId===drag.id) endDrag(); });
trayEl.addEventListener('pointercancel', () => { if (drag) { drag.r=null; endDrag(); } });

function moveDrag(x, y){
  const {g, w, h, p} = drag;
  const left = x - w/2, top = y - h - LIFT;
  floatEl.style.transform = `translate(${left}px,${top}px)`;
  const c = Math.round((left - g.x)/g.pitch), r = Math.round((top - g.y)/g.pitch);
  if (r===drag.r && c===drag.c) return;
  clearMarks();
  if (canPlace(p, r, c)){
    drag.r=r; drag.c=c;
    for (const [dr,dc] of p.cells){ const el=cellEls[(r+dr)*N+c+dc]; el.classList.add('ghost'); el.style.setProperty('--col', p.color); }
    const {cells} = linesAfter(p, r, c);
    cells.forEach(idx => cellEls[idx].classList.add('will'));
  } else { drag.r=null; drag.c=null; }
}
function endDrag(){
  const {i, r, c} = drag;
  drag = null; floatEl.style.display='none'; clearMarks();
  if (r !== null && r !== undefined) place(i, r, c);
  else render();
}

window.addEventListener('resize', () => S && renderTray());

// ---------- Boot ----------
try {
  const saved = JSON.parse(store.get('bs-state'));
  if (saved && saved.grid && saved.grid.length===N*N && saved.hand && !saved.over) S = saved;
} catch {}
if (!S) { S = fresh(); S.hand = dealHand(); }
shownScore = S.score;
render();
afterMove();
if (S.over){ S = fresh(); S.hand = dealHand(); shownScore = 0; save(); render(); }
hideOv();
showHome();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
