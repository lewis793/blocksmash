<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12131f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="blocksmash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>blocksmash</title>
<style>
:root{
  --bg:#12131f;--panel:#1c1e30;--cell:#252840;--text:#eef0ff;--muted:#8a8fb5;
  --accent:#ffb020;--danger:#ff5d5d;--gap:4px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;
  max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px)}
header{width:100%;display:flex;justify-content:space-between;align-items:flex-end}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
#score{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#best{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.iconbtn{background:var(--panel);color:var(--muted);border:0;border-radius:10px;width:36px;height:36px;
  font-size:18px;font-weight:700;display:grid;place-items:center}
.row{display:flex;gap:8px}

#board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:var(--gap);padding:var(--gap);
  background:var(--panel);border-radius:14px;width:min(100%,54vh);aspect-ratio:1}
.c{border-radius:6px;background:var(--cell);transition:background .08s}
.f,.blk{background:var(--col);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.2)}
.ghost{background:var(--col);opacity:.45}
.will{filter:brightness(1.35);outline:2px solid rgba(255,255,255,.7);outline-offset:-2px}
.target{outline:3px solid var(--danger);outline-offset:-3px;filter:brightness(.8)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.burst{position:absolute;border-radius:6px;background:var(--col);animation:burst .5s ease-out both;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.2)}
@keyframes burst{0%{transform:scale(1)}25%{transform:scale(1.25);filter:brightness(2.4)}100%{transform:scale(0) rotate(60deg);opacity:0}}
.spark{position:absolute;border-radius:2px;background:var(--col);animation:spark .7s cubic-bezier(.2,.7,.4,1) both}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(var(--rot));opacity:0}}
.flash{position:absolute;background:#fff;border-radius:8px;animation:flash .4s ease-out both}
@keyframes flash{0%{opacity:.9}100%{opacity:0;transform:scale(1.06)}}
#board.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

#smashbar{width:min(100%,54vh);display:flex;align-items:center;gap:10px}
#pips{flex:1;display:flex;gap:5px}
.pip{flex:1;height:10px;border-radius:5px;background:var(--cell);transition:background .2s}
.pip.on{background:var(--accent)}
#smash{border:0;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;letter-spacing:.08em;
  background:var(--cell);color:var(--muted)}
#smash.ready{background:var(--accent);color:#2a1a00;animation:throb .7s infinite alternate ease-in-out}
#smash.armed{background:var(--danger);color:#fff;animation:none}
@keyframes throb{from{transform:scale(1)}to{transform:scale(1.08)}}

#tray{width:100%;flex:1;min-height:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:grid;place-items:center;position:relative}
.piece{position:relative}
.piece .blk{position:absolute;border-radius:4px}
.slot.dead .piece{opacity:.3}
.slot.lifted .piece{opacity:0}

#float{position:fixed;left:0;top:0;pointer-events:none;z-index:10;display:none}
#float .blk{position:absolute;border-radius:6px}

#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
  font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);opacity:0;white-space:nowrap}
#toast.show{animation:rise .9s ease-out}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
#hint{min-height:18px;font-size:13px;color:var(--accent);font-weight:600;text-align:center}

#ov{position:fixed;inset:0;background:rgba(10,11,20,.86);display:none;place-items:center;z-index:20;padding:24px}
#ov.show{display:grid}
.card{background:var(--panel);border-radius:18px;padding:26px 22px;max-width:360px;width:100%;text-align:center}
.card h2{font-size:28px;font-weight:900;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px;line-height:1.45;margin:8px 0}
.card .big{font-size:52px;font-weight:900;color:var(--text);margin:4px 0}
.card ul{text-align:left;color:var(--muted);font-size:14px;line-height:1.5;margin:10px 0 4px 18px}
.btn{border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:800;margin-top:14px;width:100%;
  background:var(--accent);color:#2a1a00}
.btn.alt{background:var(--cell);color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="label">Score</div>
      <div id="score">0</div>
    </div>
    <div class="right">
      <div class="row">
        <button class="iconbtn" id="helpBtn" aria-label="How to play">?</button>
        <button class="iconbtn" id="restartBtn" aria-label="New game">↻</button>
      </div>
      <div><span class="label">Best </span><span id="best">0</span></div>
    </div>
  </header>

  <div id="board"><div id="fx"></div><div id="toast"></div></div>

  <div id="smashbar">
    <div id="pips"></div>
    <button id="smash">SMASH</button>
  </div>
  <div id="hint"></div>

  <div id="tray"></div>
</div>
<div id="float"></div>
<div id="ov"><div class="card" id="card"></div></div>

<script>
'use strict';
const N = 8, SMASH_MAX = 5;
const COLORS = ['#ff5d5d','#ffb020','#2ed3a0','#3aa8ff','#9b6bff','#ff6bc1','#ff8a3d','#5ee0e6'];

// ---------- Pieces ----------
// Base shapes ('#' = block, '|' = new row) with a weight. All rotations are generated.
const BASE = [
  ['#',1], ['##',2], ['###',2], ['####',2], ['#####',2],
  ['##|##',3], ['###|###',3], ['###|###|###',3],
  ['#.|##',2], ['#.|#.|##',2], ['.#|.#|##',2],
  ['###|.#.',2], ['##.|.##',1], ['.##|##.',1], ['#..|#..|###',3],
];
const parse = s => { const out=[]; s.split('|').forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==='#') out.push([r,c]); })); return out; };
const norm = cells => {
  const mr=Math.min(...cells.map(p=>p[0])), mc=Math.min(...cells.map(p=>p[1]));
  return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
};
const rot = cells => norm(cells.map(([r,c])=>[c,-r]));
const SHAPES = BASE.map(([s,w]) => {
  const seen=new Set(), orients=[]; let cur=norm(parse(s));
  for (let i=0;i<4;i++){ const k=JSON.stringify(cur); if(!seen.has(k)){seen.add(k);orients.push(cur);} cur=rot(cur); }
  return {orients, w};
});
const TOTAL_W = SHAPES.reduce((a,s)=>a+s.w,0);

// ---------- The honest dealer ----------
// Uniform randomness from the OS. It never looks at your score, your history, or anything else.
const rand = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
const pick = arr => arr[Math.floor(rand()*arr.length)];
function randomPiece(){
  let x = rand()*TOTAL_W, shape = SHAPES[0];
  for (const s of SHAPES){ if ((x -= s.w) < 0){ shape = s; break; } }
  const cells = pick(shape.orients);
  return { cells, h: Math.max(...cells.map(p=>p[0]))+1, w: Math.max(...cells.map(p=>p[1]))+1, color: pick(COLORS) };
}
// Fair-hand rule: re-deal (randomly) until every piece fits somewhere on the board.
// It never chooses pieces to help or hurt you. If no fair hand turns up, you get a random one.
function dealHand(){
  let hand;
  for (let i=0;i<60;i++){
    hand = [randomPiece(), randomPiece(), randomPiece()];
    if (hand.every(fitsAnywhere)) return hand;
  }
  return hand;
}

// ---------- State ----------
let S;
function fresh(){ return { grid: Array(N*N).fill(null), hand: null, score: 0, meter: 0, combo: 0, since: 0, over: false }; }
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let best = +store.get('bs-best') || 0;
function save(){ store.set('bs-state', JSON.stringify(S)); if (S.score > best){ best = S.score; store.set('bs-best', best); } }

const at = (r,c) => S.grid[r*N+c];
function canPlace(p, r, c){
  for (const [dr,dc] of p.cells){
    const rr=r+dr, cc=c+dc;
    if (rr<0||cc<0||rr>=N||cc>=N||at(rr,cc)) return false;
  }
  return true;
}
function fitsAnywhere(p){
  for (let r=0;r<=N-p.h;r++) for (let c=0;c<=N-p.w;c++) if (canPlace(p,r,c)) return true;
  return false;
}
// Which cells would clear if p were placed at r,c
function linesAfter(p, r, c){
  const g = S.grid.slice();
  for (const [dr,dc] of p.cells) g[(r+dr)*N + c+dc] = 1;
  const out = new Set(), rows = [], cols = [];
  for (let i=0;i<N;i++){
    let row=true, col=true;
    for (let j=0;j<N;j++){ if(!g[i*N+j]) row=false; if(!g[j*N+i]) col=false; }
    if (row){ rows.push(i); for(let j=0;j<N;j++) out.add(i*N+j); }
    if (col){ cols.push(i); for(let j=0;j<N;j++) out.add(j*N+i); }
  }
  return {cells: out, lines: rows.length + cols.length, rows, cols};
}

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const boardEl=$('board'), trayEl=$('tray'), floatEl=$('float'), toastEl=$('toast');
const cellEls = [];
for (let i=0;i<N*N;i++){ const d=document.createElement('div'); d.className='c'; boardEl.appendChild(d); cellEls.push(d); }
for (let i=0;i<SMASH_MAX;i++){ const d=document.createElement('div'); d.className='pip'; $('pips').appendChild(d); }
const slots = [0,1,2].map(i => { const d=document.createElement('div'); d.className='slot'; d.dataset.i=i; trayEl.appendChild(d); return d; });

function boardGeom(){
  const a=cellEls[0].getBoundingClientRect(), b=cellEls[1].getBoundingClientRect();
  return { x:a.left, y:a.top, size:a.width, pitch:b.left-a.left };
}

function render(){
  S.grid.forEach((col,i)=>{
    const el=cellEls[i];
    el.className = col ? 'c f' : 'c';
    if (col) el.style.setProperty('--col', col); else el.style.removeProperty('--col');
  });
  $('score').textContent = S.score;
  $('best').textContent = Math.max(best, S.score);
  [...$('pips').children].forEach((p,i)=>p.classList.toggle('on', i < S.meter));
  const sb=$('smash');
  sb.className = smashArmed ? 'armed' : (S.meter>=SMASH_MAX ? 'ready' : '');
  sb.textContent = smashArmed ? 'CANCEL' : 'SMASH';
  renderTray();
}
function renderTray(){
  const g = boardGeom();
  slots.forEach((slot,i)=>{
    slot.innerHTML=''; slot.classList.remove('dead','lifted');
    const p = S.hand[i]; if (!p) return;
    const sw = slot.clientWidth, sh = slot.clientHeight;
    const size = Math.min(g.size*0.6, (sw-8)/5, (sh-8)/5);
    const gap = Math.max(2, size*0.08);
    const piece = document.createElement('div'); piece.className='piece';
    piece.style.width = (p.w*size + (p.w-1)*gap) + 'px';
    piece.style.height = (p.h*size + (p.h-1)*gap) + 'px';
    for (const [r,c] of p.cells){
      const b=document.createElement('div'); b.className='blk';
      b.style.cssText = `--col:${p.color};width:${size}px;height:${size}px;left:${c*(size+gap)}px;top:${r*(size+gap)}px`;
      piece.appendChild(b);
    }
    slot.appendChild(piece);
    if (!fitsAnywhere(p)) slot.classList.add('dead');
  });
}

function toast(text){
  toastEl.textContent = text;
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
}
function hint(text){ $('hint').textContent = text || ''; }

// ---------- Game flow ----------
function place(i, r, c){
  const p = S.hand[i];
  for (const [dr,dc] of p.cells) S.grid[(r+dr)*N + c+dc] = p.color;
  S.score += p.cells.length;
  S.hand[i] = null;

  const {cells, lines, rows, cols} = linesAfter({cells:[], h:0, w:0}, 0, 0);
  const cleared = [];
  if (lines){
    S.combo++; S.since = 0;
    const pts = Math.round(10 * lines*(lines+1)/2 * (1 + (S.combo-1)*0.5));
    S.score += pts;
    S.meter = Math.min(SMASH_MAX, S.meter + lines);
    cells.forEach(idx => { cleared.push([idx, S.grid[idx]]); S.grid[idx] = null; });
    const NAMES = ['', '', 'DOUBLE!', 'TRIPLE!', 'QUAD!'];
    toast((NAMES[lines] || (lines > 4 ? 'MEGA!' : '')) + ` +${pts}` + (S.combo>1 ? `  x${S.combo}` : ''));
    if (lines >= 2) shake();
    if (navigator.vibrate) navigator.vibrate(lines >= 2 ? [30,40,30] : 25);
  } else if (++S.since >= 3){ S.combo = 0; }

  if (S.hand.every(x=>!x)) S.hand = dealHand();
  afterMove(cleared, { origin: [r + (p.h-1)/2, c + (p.w-1)/2], rows, cols });
}

function shake(){ boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); }

// Clear effects live on their own layer over the board, so the board itself is always up to date.
const fxEl = $('fx');
function effects(cleared, info){
  if (!cleared || !cleared.length) return;
  const nodes = [];
  const add = (cls, css) => { const d=document.createElement('div'); d.className=cls; d.style.cssText=css; fxEl.appendChild(d); nodes.push(d); };
  const box = el => ({ l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight });
  for (const i of info.rows || []){
    const a = box(cellEls[i*N]), b = box(cellEls[i*N+N-1]);
    add('flash', `left:${a.l}px;top:${a.t}px;width:${b.l+b.w-a.l}px;height:${a.h}px`);
  }
  for (const i of info.cols || []){
    const a = box(cellEls[i]), b = box(cellEls[(N-1)*N+i]);
    add('flash', `left:${a.l}px;top:${a.t}px;width:${a.w}px;height:${b.t+b.h-a.t}px`);
  }
  const [or, oc] = info.origin || [3.5, 3.5];
  let maxDelay = 0;
  for (const [idx, col] of cleared){
    const r = Math.floor(idx/N), c = idx%N, b = box(cellEls[idx]);
    const delay = Math.round((Math.abs(r-or) + Math.abs(c-oc)) * 30);
    maxDelay = Math.max(maxDelay, delay);
    add('burst', `--col:${col};left:${b.l}px;top:${b.t}px;width:${b.w}px;height:${b.h}px;animation-delay:${delay}ms`);
    for (let k=0;k<3;k++){
      const ang = rand()*Math.PI*2, dist = 30 + rand()*70, s = 5 + rand()*6;
      add('spark', `--col:${col};left:${b.l+b.w/2-s/2}px;top:${b.t+b.h/2-s/2}px;width:${s}px;height:${s}px;` +
        `--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;--rot:${Math.round(rand()*360)}deg;animation-delay:${delay}ms`);
    }
  }
  setTimeout(() => nodes.forEach(n => n.remove()), 800 + maxDelay);
}

function afterMove(cleared, info){
  hint('');
  const anyFit = S.hand.some(p => p && fitsAnywhere(p));
  if (!anyFit){
    if (S.meter >= SMASH_MAX) hint('Out of moves — smash something!');
    else S.over = true;
  }
  save(); render();
  effects(cleared, info || {});
  if (S.over) setTimeout(showGameOver, cleared && cleared.length ? 900 : 300);
}

function smashAt(r0, c0){
  const cleared = [];
  for (let r=r0-1;r<=r0+1;r++) for (let c=c0-1;c<=c0+1;c++){
    if (r<0||c<0||r>=N||c>=N) continue;
    const idx=r*N+c; if (S.grid[idx]){ cleared.push([idx,S.grid[idx]]); S.grid[idx]=null; }
  }
  S.score += cleared.length * 2;
  S.meter = 0; smashArmed = false;
  shake();
  if (navigator.vibrate) navigator.vibrate(60);
  toast('SMASH!');
  afterMove(cleared, { origin: [r0, c0] });
}

function newGame(){
  S = fresh(); S.hand = dealHand(); smashArmed=false;
  save(); hint(''); render(); hideOv();
}

// ---------- Overlay ----------
function showOv(html){ $('card').innerHTML = html; $('ov').classList.add('show'); }
function hideOv(){ $('ov').classList.remove('show'); }
function showGameOver(){
  const isBest = S.score >= best && S.score > 0;
  showOv(`<div class="label">${isBest ? 'New best!' : 'Out of moves'}</div>
    <div class="big">${S.score}</div>
    <p>Best: ${best}</p>
    <p>No ads. No revives. That one was all you.</p>
    <button class="btn" id="again">Play again</button>`);
  $('again').onclick = newGame;
}
function showHelp(){
  showOv(`<h2>blocksmash</h2>
    <ul>
      <li>Drag pieces onto the board.</li>
      <li>Fill a row or column to clear it. Keep clearing for a combo.</li>
      <li>Every line charges your <b style="color:var(--accent)">SMASH</b>. Full charge = blow up any 3×3 area.</li>
      <li>Game ends when nothing fits and you've no smash left.</li>
    </ul>
    <p><b style="color:var(--text)">The honest dealer:</b> pieces are purely random. It only re-deals if a piece wouldn't fit anywhere. It never looks at your score. No ads, ever.</p>
    <button class="btn" id="ok">Let's go</button>`);
  $('ok').onclick = () => { store.set('bs-seen','1'); hideOv(); };
}
$('helpBtn').onclick = showHelp;
$('restartBtn').onclick = () => {
  showOv(`<h2>Start over?</h2><p>Your current score is ${S.score}.</p>
    <button class="btn" id="yes">New game</button><button class="btn alt" id="no">Keep playing</button>`);
  $('yes').onclick = newGame; $('no').onclick = hideOv;
};

// ---------- Smash ----------
let smashArmed = false, smashCell = null;
$('smash').onclick = () => {
  if (smashArmed){ smashArmed=false; clearMarks(); render(); return; }
  if (S.meter < SMASH_MAX || S.over) return;
  smashArmed = true; hint('Tap the board to smash a 3×3 area'); render();
};
function cellFromPoint(x, y){
  const g = boardGeom();
  const c = Math.floor((x - g.x + (g.pitch-g.size)/2) / g.pitch);
  const r = Math.floor((y - g.y + (g.pitch-g.size)/2) / g.pitch);
  return (r<0||c<0||r>=N||c>=N) ? null : [r,c];
}
function markSmash(rc){
  clearMarks();
  if (!rc) return;
  for (let r=rc[0]-1;r<=rc[0]+1;r++) for (let c=rc[1]-1;c<=rc[1]+1;c++)
    if (r>=0&&c>=0&&r<N&&c<N) cellEls[r*N+c].classList.add('target');
}
function clearMarks(){ cellEls.forEach(el=>el.classList.remove('ghost','will','target')); }
boardEl.addEventListener('pointerdown', e => {
  if (!smashArmed) return;
  boardEl.setPointerCapture(e.pointerId);
  smashCell = cellFromPoint(e.clientX, e.clientY); markSmash(smashCell);
});
boardEl.addEventListener('pointermove', e => {
  if (!smashArmed || !smashCell) return;
  smashCell = cellFromPoint(e.clientX, e.clientY); markSmash(smashCell);
});
boardEl.addEventListener('pointerup', e => {
  if (!smashArmed || !smashCell) return;
  const rc = smashCell; smashCell = null; clearMarks();
  smashAt(rc[0], rc[1]);
});

// ---------- Dragging ----------
let drag = null;
const LIFT = 70; // piece floats above your finger so you can see it
trayEl.addEventListener('pointerdown', e => {
  if (smashArmed || S.over) return;
  const slot = e.target.closest('.slot'); if (!slot) return;
  const i = +slot.dataset.i, p = S.hand[i]; if (!p) return;
  const g = boardGeom(), gap = g.pitch - g.size;
  floatEl.innerHTML = '';
  for (const [r,c] of p.cells){
    const b=document.createElement('div'); b.className='blk';
    b.style.cssText = `--col:${p.color};width:${g.size}px;height:${g.size}px;left:${c*g.pitch}px;top:${r*g.pitch}px`;
    floatEl.appendChild(b);
  }
  const w = p.w*g.pitch - gap, h = p.h*g.pitch - gap;
  drag = { i, p, g, w, h, r:null, c:null, id:e.pointerId };
  slot.classList.add('lifted');
  floatEl.style.display = 'block';
  trayEl.setPointerCapture(e.pointerId);
  moveDrag(e.clientX, e.clientY);
});
trayEl.addEventListener('pointermove', e => { if (drag && e.pointerId===drag.id) moveDrag(e.clientX, e.clientY); });
trayEl.addEventListener('pointerup', e => { if (drag && e.pointerId===drag.id) endDrag(); });
trayEl.addEventListener('pointercancel', () => { if (drag) { drag.r=null; endDrag(); } });

function moveDrag(x, y){
  const {g, w, h, p} = drag;
  const left = x - w/2, top = y - h - LIFT;
  floatEl.style.transform = `translate(${left}px,${top}px)`;
  const c = Math.round((left - g.x)/g.pitch), r = Math.round((top - g.y)/g.pitch);
  if (r===drag.r && c===drag.c) return;
  clearMarks();
  if (canPlace(p, r, c)){
    drag.r=r; drag.c=c;
    for (const [dr,dc] of p.cells){ const el=cellEls[(r+dr)*N+c+dc]; el.classList.add('ghost'); el.style.setProperty('--col', p.color); }
    const {cells} = linesAfter(p, r, c);
    cells.forEach(idx => cellEls[idx].classList.add('will'));
  } else { drag.r=null; drag.c=null; }
}
function endDrag(){
  const {i, r, c} = drag;
  drag = null; floatEl.style.display='none'; clearMarks();
  if (r !== null && r !== undefined) place(i, r, c);
  else render();
}

window.addEventListener('resize', () => S && renderTray());

// ---------- Boot ----------
try {
  const saved = JSON.parse(store.get('bs-state'));
  if (saved && saved.grid && saved.grid.length===N*N && saved.hand && !saved.over) S = saved;
} catch {}
if (!S) { S = fresh(); S.hand = dealHand(); }
render();
afterMove();
if (!store.get('bs-seen')) showHelp();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
